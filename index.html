function frErr(m){ const e=document.getElementById("frErr"); if(e) e.textContent=m; }
function frAction(a,b){
  const F=frS(), v=b.dataset.v;
  const loveKey=name=>(LOVE.find(l=>loveName(l[0])===name)||[])[0];
  const toggle=(arr,x,max)=>arr.includes(x)?arr.filter(y=>y!==x):(max&&arr.length>=max?arr.slice(1).concat([x]):arr.concat([x]));
  if(a==="fr-baro"){ const v2=parseFloat(document.getElementById("losVal").value); F.baro=(F.baro||[]).concat([{date:new Date().toISOString(), v:v2}]); save(); toast("Eingetragen. Nächste Einschätzung in einer Woche."); render(); }
  else if(a==="fr-home"){ ui.frView="main"; render(); window.scrollTo(0,0); }
  else if(a==="fr-view"){ ui.frView=v; if(v==="moment") ui.frM={q:[],lv:null,love:[]}; render(); window.scrollTo(0,0); }
  else if(a==="fr-m-q"){ frKeepMoment(); ui.frM.q=toggle(ui.frM.q,v,2); render(); }
  else if(a==="fr-m-lv"){ frKeepMoment(); ui.frM.lv=+v; render(); }
  else if(a==="fr-m-love"){ frKeepMoment(); ui.frM.love=toggle(ui.frM.love,loveKey(v)); render(); }
  else if(a==="fr-m-save"){
    frKeepMoment(); const m=ui.frM;
    if(!(m.was||"").trim()){ frErr("Schreib kurz auf, was schön war."); document.getElementById("frWas").focus(); return; }
    const L=[m.was.trim()]; if(m.tell&&m.tell.trim()) L.push("Erzählen möchte ich es: "+m.tell.trim());
    addEntry({ area:"freude", title:"", text:L.join("\n"), meta:{ qualities:m.q, strength:m.lv, love:m.love, tell:(m.tell||"").trim() } });
    ui.frM=null; ui.frView="main"; toast("Festgehalten. Schön, dass es diesen Moment gab."); location.hash="#/journal";
  }
  else if(a==="fr-e-q"){ F.ess.qualities=toggle(F.ess.qualities,v,2); save(); render(); }
  else if(a==="fr-e-qadd"){ const w=document.getElementById("frQfree").value.trim(); if(w){ F.ess.qualities=toggle(F.ess.qualities.filter(x=>x!==w),w,2); save(); } render(); }
  else if(a==="fr-e-back"){ const d=F.ess; if(!d||d.step===0){ F.ess=null; save(); ui.frView="main"; } else { d.step--; save(); } render(); window.scrollTo(0,0); }
  else if(a==="fr-e-next"){
    const d=F.ess, inp=document.getElementById("frIn"), val=inp?inp.value.trim():"";
    if(d.step===1){ if(!val) return frErr("Schreib kurz auf, was du getan hast."); d.form=val; }
    if(d.step===2){ d.scene=val; }
    if(d.step===3){ if(!d.qualities.length) return frErr("Wähle mindestens eine Qualität."); }
    if(d.step===4){ d.name=val||d.qualities[0]; }
    d.step++; save(); render(); window.scrollTo(0,0);
  }
  else if(a==="fr-e-save"){
    const d=F.ess; d.bridges=[...document.querySelectorAll(".fr-bridge")].map(x=>x.value.trim()).filter(Boolean);
    const e={ id:uid(), name:d.name||d.qualities[0]||"Meine Essenz", qualities:d.qualities, form:d.form, scene:d.scene, bridges:d.bridges, date:new Date().toISOString() };
    F.essences.push(e);
    const L=["Form: "+e.form]; if(e.scene) L.push("Moment: "+e.scene); L.push("Qualität: "+e.qualities.join(", ")); if(e.bridges.length) L.push("Heute: "+e.bridges.join(" · "));
    addEntry({ area:"freude", title:"Essenz: "+e.name, text:L.join("\n"), meta:{ essence:e.id, qualities:e.qualities } });
    F.ess=null; ui.frView="main"; save(); toast("Deine Essenz ist gespeichert."); render(); window.scrollTo(0,0);
  }
  else if(a==="fr-lib-q"){ ui.frQ=v; render(); }
  else if(a==="fr-own-add"){ const f=document.getElementById("frOwn").value.trim(); if(f){ F.own.push({ id:"o"+uid(), form:f, q:[] }); save(); toast("Hinzugefügt."); } render(); }
  else if(a==="fr-try"){
    const f=allForms().find(x=>x.id===v); if(!f) return;
    addCheckin({ area:"freude", text:"Ausprobieren: "+f.form, inDays:2, link:"#/bereich/freude" });
    F.pending.unshift({ id:uid(), fid:f.id, form:f.form, ci:S.checkins[S.checkins.length-1].id });
    ui.frView="main"; save(); toast("Viel Freude beim Ausprobieren!"); render(); window.scrollTo(0,0);
  }
  else if(a==="fr-try-drop"){ const p=F.pending.find(x=>x.id===v); if(p){ const c=S.checkins.find(c=>c.id===p.ci); if(c) c.done=true; } F.pending=F.pending.filter(x=>x.id!==v); save(); render(); }
  else if(a==="fr-try-done"){ ui.frTry=v; ui.frT={lv:null,fit:null,love:[]}; ui.frView="try"; render(); window.scrollTo(0,0); }
  else if(a==="fr-t-lv"||a==="fr-t-fit"||a==="fr-t-love"){
    const n=document.getElementById("frNote"); if(n) ui.frT.note=n.value;
    if(a==="fr-t-lv") ui.frT.lv=+v; if(a==="fr-t-fit") ui.frT.fit=v; if(a==="fr-t-love") ui.frT.love=toggle(ui.frT.love,loveKey(v));
    render();
  }
  else if(a==="fr-t-save"){
    const t=ui.frT, p=F.pending.find(x=>x.id===ui.frTry); if(!p) return;
    t.note=(document.getElementById("frNote").value||"").trim();
    if(!t.lv||!t.fit) return frErr("Tippe noch an, wie viel Freude es war und ob es zu dir passt.");
    F.lib[p.fid]={ lv:t.lv, fit:t.fit, date:new Date().toISOString() };
    const L=["Freude: "+t.lv+" von 5 · Passt zu mir: "+({ja:"Ja",vielleicht:"Vielleicht",nein:"Eher nicht"}[t.fit])]; if(t.note) L.push(t.note);
    addEntry({ area:"freude", title:"Ausprobiert: "+p.form, text:L.join("\n"), meta:{ tried:p.fid, strength:t.lv, love:t.love } });
    const c=S.checkins.find(c=>c.id===p.ci); if(c) c.done=true;
    F.pending=F.pending.filter(x=>x.id!==p.id); ui.frView="main"; save(); toast("Im Journal festgehalten."); render(); window.scrollTo(0,0);
  }
}

/* ---------- Erkennen, Tür 2: Altes einordnen ---------- */
const ORD_FEEL = [
  ["Wut","Eine Grenze wurde verletzt."],["Trauer","Etwas Wertvolles ist verloren gegangen."],["Angst","Ich will mich schützen."],
  ["Ekel","Das war nicht gut für mich. Ich will Abstand."],["Enttäuschung","Eine Erwartung hat sich nicht erfüllt."],["Kränkung","Mein Wert wurde nicht gesehen."],
  ["Einsamkeit","Ich brauche Verbindung."],["Scham","Ich fühlte mich bloßgestellt oder nicht richtig."],["Schuld","Ich glaube, ich habe etwas falsch gemacht."],["Ohnmacht","Ich konnte damals nichts tun."]
];
const ORD_NEEDS = ["Anerkennung","Ehrlichkeit","Verlässlichkeit","Respekt","Schutz","Nähe","Gehört werden","Abstand","Unterstützung","Ein klares Ende"];
const ORD_STEPS = 8;
function ordThemes(){ if(!S.themes) S.themes=[]; return S.themes; }
function ordNew(themeId){ const t=themeId?ordThemes().find(x=>x.id===themeId):null; return { begun:new Date().toISOString(), step:t?1:0, themeId:t?t.id:null, themeName:t?t.name:"", feelings:[], strength:5, good:"", hurt:"", sentence:"", needs:[], need:"", mine:"", notMine:"", keep:"", go:"", peace:"" }; }
function ordProg(n){ return `<div style="display:flex;flex-direction:column;gap:8px"><div class="steps" aria-hidden="true" style="display:grid;grid-template-columns:repeat(${ORD_STEPS},1fr)">${Array.from({length:ORD_STEPS},(_,i)=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div><div class="small muted">Altes einordnen · Schritt ${n+1} von ${ORD_STEPS}</div></div>`; }
function ordNav(first){ return `<div id="erkErr" class="small" style="color:var(--danger);min-height:18px"></div><button class="btn" data-act="ord-next">Weiter</button>${first?"":`<button class="linkbtn" data-act="ord-back">‹ Zurück</button>`}
  ${ui.ordConfirmCancel?`<div class="row" style="justify-content:center"><button class="btn sm danger" data-act="ord-cancel-yes">Ja, abbrechen</button><button class="btn sm quiet" data-act="ord-cancel-no">Weitermachen</button></div>`:`<button class="linkbtn" data-act="ord-cancel">Abbrechen</button>`}`; }
function ordPeace(O){
  const p=[]; p.push(O.good ? "Es war wertvoll, und es ist vorbei." : "Es ist geschehen, und es ist vorbei.");
  if(O.keep) p.push("Ich nehme mit: "+O.keep+".");
  if(O.go) p.push("Ich lasse gehen: "+O.go+".");
  return p.join(" ").replace(/\.\./g,".");
}
function themeLine(t){
  const h=t.history||[]; if(!h.length) return "";
  const first=h[0].strength, last=h[h.length-1].strength;
  return `${h.length}× eingeordnet · ${h.length>1?`anfangs ${fmtV(first)}, zuletzt ${fmtV(last)}`:`Stärke ${fmtV(last)}`}`;
}
function screenErkDoors(){
  const T=ordThemes();
  return `${erkBar()}<h1>Worum geht es dir?</h1>
    <button class="path" data-act="ein-start"><span class="k">Eine Einsicht</span><span class="t">Mir ist etwas klar geworden</span><span class="d">Ein Aha-Moment über dich oder dein Leben. Vier kurze Fragen, dann entscheidest du, was du damit tust.</span></button>
    <button class="path" data-act="erk-start"><span class="k">Nach vorn schauen</span><span class="t">Etwas hält mich ab</span><span class="d">Ein Wunsch, und etwas bremst dich. Bis zu sieben Fragen zu Wunsch, Bremse und Erlaubnis. Was nicht passt, überspringst du.</span></button>
    <button class="path" data-act="ord-start"><span class="k">Zurück schauen</span><span class="t">Etwas Altes kommt hoch</span><span class="d">Eine alte Geschichte, die immer wieder anklopft. Einordnen, würdigen, Frieden finden.</span></button>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="small muted" style="font-weight:600">Deine Themen</div>
      ${T.length ? T.slice().sort((a,b)=>(b.last||"").localeCompare(a.last||"")).map(t=>`<button class="entry" style="text-align:left;width:100%;cursor:pointer" data-act="ord-start" data-v="${t.id}">
          <div class="body"><div class="title">${esc(t.name)}</div>
          ${t.feelings&&t.feelings.length?`<div class="kicker">${esc(t.feelings.join(", "))}</div>`:""}
          <div class="small muted">${esc(themeLine(t))}</div>
          ${t.peace?`<div class="small" style="line-height:1.4;font-family:var(--serif)">„${esc(t.peace)}“</div>`:""}</div></button>`).join("")
        : `<div class="soft small">Hier sammeln sich alte Themen, die du einordnest. Mit der Zeit siehst du, wie sie leiser werden.</div>`}
    </div>`;
}
function screenOrd(){
  const O=S.ord, s=O.step, T=ordThemes();
  const field=(id,val,ph,rows=3)=>`<textarea class="t" id="${id}" rows="${rows}" placeholder="${esc(ph)}">${esc(val||"")}</textarea>`;
  if(s===0) return `${erkBar()}${ordProg(0)}<h1>Welches alte Thema kommt hoch?</h1>
    ${T.length?`<div class="chips">${T.map(t=>`<button class="chip ${O.themeId===t.id?"on":""}" data-act="ord-theme" data-v="${t.id}" aria-pressed="${O.themeId===t.id}">${esc(t.name)}</button>`).join("")}</div><div class="small muted">Oder ein neues Thema:</div>`:""}
    <input class="t" id="erkIn" maxlength="50" autocomplete="off" placeholder="z. B. Mein alter Freund" value="${O.themeId?"":esc(O.themeName)}" aria-label="Neues Thema">
    ${ordNav(true)}`;
  if(s===1){
    const sel=ORD_FEEL.filter(f=>O.feelings.includes(f[0]));
    return `${erkBar()}${ordProg(1)}<h1>Welches Gefühl ist am stärksten?</h1>
    <div class="muted small">Eins oder zwei.</div>
    <div class="chips">${ORD_FEEL.map(([f])=>`<button class="chip ${O.feelings.includes(f)?"on":""}" data-act="ord-feel" data-v="${f}" aria-pressed="${O.feelings.includes(f)}">${f}</button>`).join("")}</div>
    ${sel.length?`<div class="card"><div class="kicker">Was dir das Gefühl sagen will</div>${sel.map(([f,m])=>`<div style="line-height:1.45"><b>${f}:</b> ${m}</div>`).join("")}</div>`:""}
    ${ordNav()}`;
  }
  if(s===2) return `${erkBar()}${ordProg(2)}<h1>Wie stark ist es gerade?</h1>
    <div class="muted small">So siehst du später, ob es leiser wird.</div>${losRange(O.strength)}${ordNav()}`;
  if(s===3) return `${erkBar()}${ordProg(3)}<h1>Was war gut daran?</h1>
    <div class="muted" style="line-height:1.45">Was war wertvoll, was hat es dir gegeben? Wenn es nichts Gutes gab, darf das Feld leer bleiben.</div>
    ${field("erkIn",O.good,"z. B. Wir haben viele Jahre zusammen gelacht und uns aufeinander verlassen.",4)}${ordNav()}`;
  if(s===4) return `${erkBar()}${ordProg(4)}<h1>Was tut heute noch weh?</h1>
    ${field("erkIn",O.hurt,"Schreib es so, wie es sich anfühlt.",3)}
    <label class="f" for="ordSent" style="font-size:17px">Welcher Satz taucht auf, wenn es hochkommt?</label>
    <input class="t" id="ordSent" maxlength="120" value="${esc(O.sentence)}" placeholder="z. B. Ich war ihm nicht wichtig.">${ordNav()}`;
  if(s===5) return `${erkBar()}${ordProg(5)}<h1>Was hättest du damals gebraucht?</h1>
    <div class="chips">${ORD_NEEDS.map(n=>`<button class="chip ${O.needs.includes(n)?"on":""}" data-act="ord-need" data-v="${n}" aria-pressed="${O.needs.includes(n)}">${n}</button>`).join("")}</div>
    ${field("erkIn",O.need,"Oder in deinen Worten …",2)}${ordNav()}`;
  if(s===6) return `${erkBar()}${ordProg(6)}<h1>Was war dein Anteil, und was nicht?</h1>
    <div class="muted" style="line-height:1.45">Nur zum Sortieren, ohne Schuld. Beide Felder dürfen leer bleiben.</div>
    <label class="small" style="font-weight:600" for="erkIn">Mein Anteil</label>${field("erkIn",O.mine,"",2)}
    <label class="small" style="font-weight:600" for="ordNot">Nicht mein Anteil</label>${field("ordNot",O.notMine,"",2)}${ordNav()}`;
  if(s===7) return `${erkBar()}${ordProg(7)}<h1>Was nimmst du mit, und was darf gehen?</h1>
    <label class="small" style="font-weight:600" for="erkIn">Das nehme ich mit</label>${field("erkIn",O.keep,"z. B. die guten Erinnerungen, was ich über Freundschaft gelernt habe",2)}
    <label class="small" style="font-weight:600" for="ordGo">Das darf gehen</label>${field("ordGo",O.go,"z. B. den Groll, die Frage nach dem Warum",2)}${ordNav()}`;
  /* Abschluss */
  if(!O.peace) O.peace=ordPeace(O);
  const row=(k,v)=>v?`<div style="display:flex;flex-direction:column;gap:2px"><div class="kicker">${k}</div><div style="line-height:1.4">${esc(v)}</div></div>`:"";
  return `${erkBar()}<div class="small muted">Eingeordnet · ${esc(shortDate(new Date()))}</div><h1>${esc(O.themeName)}</h1>
    <div class="card" style="gap:12px">
      ${row("Gefühl",O.feelings.map(f=>f+": "+(ORD_FEEL.find(x=>x[0]===f)||["",""])[1]).join(" "))}
      ${row("Stärke",fmtV(O.strength)+" von 10")}
      ${row("Was gut war",O.good)}${row("Was noch wehtut",O.hurt)}${row("Der Satz",O.sentence?"„"+O.sentence+"“":"")}
      ${row("Was ich gebraucht hätte",O.needs.concat(O.need?[O.need]:[]).join(", "))}
      ${row("Mein Anteil",O.mine)}${row("Nicht mein Anteil",O.notMine)}
    </div>
    <label class="f" for="ordPeace">Dein Friedenssatz</label>
    <textarea class="t" id="ordPeace" rows="3">${esc(O.peace)}</textarea>
    <div class="small muted">Du kannst ihn so ändern, dass er für dich stimmt.</div>
    <button class="btn" data-act="ord-save">Ins Journal</button>
    <button class="btn line" data-act="ord-save-los">Ins Journal und zum Loslassen</button>

function ordSave(){

  addEntry({ area:"erkennen", title:"Eingeordnet: "+O.themeName, text:L.join("\n"), meta:{ kind:"ordnen", theme:t.id, strength:O.strength } });
  const name=O.themeName; S.ord=null; save(); return name;
}
function ordAction(a,b){
  const O=S.ord, v=b.dataset.v;
  const val=id=>{ const f=document.getElementById(id); return f?f.value.trim():""; };
  const keep=()=>{ if(!O) return; const s=O.step;
    if(s===0){ const n=val("erkIn"); if(n){ O.themeName=n; O.themeId=null; } }
    if(s===2){ const r=document.getElementById("losVal"); if(r) O.strength=parseFloat(r.value); }
    if(s===3) O.good=val("erkIn");
    if(s===4){ O.hurt=val("erkIn"); O.sentence=val("ordSent"); }
    if(s===5) O.need=val("erkIn");
    if(s===6){ O.mine=val("erkIn"); O.notMine=val("ordNot"); }
    if(s===7){ O.keep=val("erkIn"); O.go=val("ordGo"); O.peace=""; }
    if(s===8){ const pe=document.getElementById("ordPeace"); if(pe) O.peace=pe.value; }
  };
  if(a==="ord-start"){ S.ord=ordNew(v||null); save(); render(); window.scrollTo(0,0); }
  else if(a==="ord-theme"){ const t=ordThemes().find(x=>x.id===v); O.themeId=t.id; O.themeName=t.name; const f=document.getElementById("erkIn"); if(f) f.value=""; save(); render(); }
  else if(a==="ord-feel"){ O.feelings=O.feelings.includes(v)?O.feelings.filter(x=>x!==v):(O.feelings.length>=2?O.feelings.slice(1):O.feelings).concat([v]); save(); render(); }
  else if(a==="ord-need"){ keep(); O.needs=O.needs.includes(v)?O.needs.filter(x=>x!==v):O.needs.concat([v]); save(); render(); }
  else if(a==="ord-back"){ keep(); O.step=Math.max(0,O.step-1); save(); render(); window.scrollTo(0,0); }
  else if(a==="ord-next"){
    keep(); const s=O.step, err=m=>{ const e=document.getElementById("erkErr"); if(e) e.textContent=m; };

    if(s===4 && !O.hurt) return err("Schreib kurz auf, was noch wehtut.");

  else if(a==="ord-cancel-yes"){ S.ord=null; ui.ordConfirmCancel=false; save(); render(); }
}

/* ---------- Gewohnheiten loslassen (Etappe 7) ---------- */
const HAB_MILES = [1,3,7,10,21,30,50,100,150,200,365];
function dKey(d){ const x=d?new Date(d):new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function dShift(n){ const x=new Date(); x.setDate(x.getDate()+n); return dKey(x); }
function habS(){ if(!S.habits) S.habits=[]; return S.habits; }
function habStats(h){
  const days=h.days||{};
  let streak=0; let k=0; if(days[dShift(0)]!=="ok") k=-1;
  if(days[dShift(0)]==="no") streak=0; else { while(days[dShift(k)]==="ok"){ streak++; k--; } }
  const keys=Object.keys(days).sort(); let best=0, run=0, prev=null;
  keys.forEach(key=>{ if(days[key]==="ok"){ const cont= prev && (new Date(key)-new Date(prev))/864e5===1; run= cont? run+1 : 1; best=Math.max(best,run); prev=key; } else { run=0; prev=null; } });
  const total=keys.filter(x=>days[x]==="ok").length;
  return { streak, best:Math.max(best,streak), total };
}
function habDue(){
  /* gibt die erste offene Frage zurück: gestern (falls offen und angelegt) oder heute ab 17 Uhr */
  for(const h of habS()){
    const created=dKey(h.created), y=dShift(-1), t=dShift(0);
    if(created<=y && !h.days[y]) return { h, key:y, label:"Gestern" };
    if(new Date().getHours()>=17 && !h.days[t]) return { h, key:t, label:"Heute" };
  }
  return null;
}
function habMark(id,key,val){
  const h=habS().find(x=>x.id===id); if(!h) return;
  h.days[key]=val; save();
  if(val==="ok"){
    const st=habStats(h);
    if(key===dShift(0)||key===dShift(-1)){
      const n=st.streak||1;
      if(HAB_MILES.includes(n)){
        addEntry({ area:"loslassen", title:"Gewohnheit: "+h.name, text:n===1?`Erster Tag ohne „${h.name}“.`:`🔥 ${n} Tage in Folge ohne „${h.name}“.\nLängste Serie: ${st.best} · insgesamt ${st.total} Tage`, meta:{ habit:h.id, streak:n } });
        toast(n===1?"Der erste Tag! Steht im Journal.":`${n} Tage in Folge! Steht im Journal.`);
      } else toast(`Geschafft! ${n} Tage in Folge.`);
    } else toast("Eingetragen.");
  } else toast("Morgen ist ein neuer erster Tag.");
}
function habCard(h){
  const st=habStats(h), t=h.days[dShift(0)], y=h.days[dShift(-1)];
  const next=HAB_MILES.find(m=>m>st.streak);
  const ask=(key,label)=>`<div class="small" style="font-weight:600;margin-top:6px">${label} ohne „${esc(h.name)}“?</div>
    <div class="row"><button class="btn sm" data-act="hab-ok" data-v="${h.id}" data-k="${key}">Geschafft</button><button class="btn sm quiet" data-act="hab-no" data-v="${h.id}" data-k="${key}">Nicht geschafft</button></div>`;
  return `<div class="card" style="gap:6px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2 style="font-size:19px">${esc(h.name)}</h2>
      <button class="linkbtn" style="min-height:32px" data-act="hab-del" data-v="${h.id}">${ui.habDel===h.id?"Wirklich entfernen?":"Entfernen"}</button></div>
    <div style="font-family:var(--serif);font-size:30px;font-weight:600;color:var(--accent)">${st.streak>0?"🔥 ":""}${st.streak} ${st.streak===1?"Tag":"Tage"} in Folge</div>
    <div class="small muted">Längste Serie: ${st.best} · insgesamt ${st.total} ${st.total===1?"Tag":"Tage"} ohne${next?` · nächster Meilenstein: ${next}`:""}</div>
    ${y===undefined && dKey(h.created)<=dShift(-1) ? ask(dShift(-1),"Gestern") : ""}
    ${t===undefined ? ask(dShift(0),"Heute") : `<div class="small" style="margin-top:4px">Heute: <b>${t==="ok"?"geschafft":"nicht geschafft"}</b> <button class="linkbtn" style="min-height:32px" data-act="hab-undo" data-v="${h.id}">ändern</button></div>`}
    <details style="margin-top:4px"><summary class="small muted" style="cursor:pointer;min-height:32px;display:flex;align-items:center">Einen Satz dazu ins Journal</summary>
      <textarea class="t" id="habNote-${h.id}" rows="2" style="margin-top:6px"></textarea>
      <button class="btn sm line" style="margin-top:6px" data-act="hab-note" data-v="${h.id}">Ins Journal</button></details>
  </div>`;
}
function screenHabits(){
  const H=habS();
  return `${losBar()}<div class="kicker">Gewohnheiten loslassen</div>
    <h1>Ein Tag nach dem anderen</h1>
    <div class="muted" style="line-height:1.45">Jeder Tag ohne eine Gewohnheit, die dir nicht guttut, ist ein kleiner Sieg. Meilensteine landen im Journal. Ein Rückfall ist kein Absturz, sondern ein Teil des Weges.</div>

const EIN_ACT = [["festhalten","Einfach festhalten"],["beobachten","Weiter beobachten"],["loslassen","Loslassen"],["schritt","Einen kleinen Schritt gehen"]];

function einAction(a,b){
  const E=S.ein, f=document.getElementById("erkIn"), val=f?f.value.trim():"";

  const keep=()=>{ if(!E) return; if(E.step===0&&f) E.what=val; if(E.step===1&&f) E.trigger=val; if(E.step===2&&f) E.meaning=val; if(E.step===4){ if(f) E.small=val; const c=document.getElementById("einAsk"); if(c) E.ask=c.checked; } };
  if(a==="ein-start"){ S.ein={ begun:new Date().toISOString(), step:0, what:"", trigger:"", meaning:"", action:null, small:"", ask:true }; save(); render(); window.scrollTo(0,0); return; }
  if(a==="ein-cancel"){ S.ein=null; save(); render(); return; }
  if(a==="ein-act"){ E.action=b.dataset.v; save(); render(); return; }
  if(a==="ein-back"){ keep(); E.step = E.step===5 ? (E.action==="schritt"?4:3) : Math.max(0,E.step-1); save(); render(); window.scrollTo(0,0); return; }
  if(a==="ein-skip"){ keep(); E.step++; save(); render(); window.scrollTo(0,0); return; }
  if(a==="ein-next"){

    else if(E.step===4){ if(!E.small) return err("Schreib einen kleinen Schritt auf."); E.step=5; }
    else E.step++;
    save(); render(); window.scrollTo(0,0); return;
  }
  if(a==="ein-save"){
    const L=[E.what]; if(E.trigger) L.push("Ausgelöst durch: "+E.trigger); if(E.meaning) L.push("Bedeutet für mich: "+E.meaning);

async function doExport(){
  const data = JSON.stringify({ app:"lebenskompass", exported:new Date().toISOString(), data:S }, null, 2);
  const d=new Date(), name=`lebenskompass-sicherung-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
  const file = new File([data], name, {type:"application/json"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Lebenskompass-Sicherung"});
    }else{
      const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    }
    S.lastBackup=new Date().toISOString(); save(); toast("Gesichert. Lege die Datei am besten in „Dateien“ ab."); render();
  }catch(e){ if(e && e.name!=="AbortError") toast("Sichern hat nicht geklappt."); }
}
document.getElementById("importFile").addEventListener("change", async ev=>{
  const f=ev.target.files[0]; ev.target.value=""; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); const d=j.data||j;
    if(!Array.isArray(d.entries)) throw 0;
    const have=new Set(S.entries.map(e=>e.id)); let n=0;
    d.entries.forEach(e=>{ if(e && e.id && e.date && !have.has(e.id)){ S.entries.push({id:String(e.id),date:String(e.date),area:String(e.area||"notiz"),title:String(e.title||""),text:String(e.text||""),meta:e.meta||null}); n++; } });
    if(Array.isArray(d.checkins)){ const hc=new Set(S.checkins.map(c=>c.id)); d.checkins.forEach(c=>{ if(c&&c.id&&!hc.has(c.id)) S.checkins.push(c); }); }
    save(); toast(n===1?"1 Eintrag wiederhergestellt.":`${n} Einträge wiederhergestellt.`); render();
  }catch(e){ toast("Diese Datei ist keine Lebenskompass-Sicherung."); }
});

  }
  else if(a==="ci-done"||a==="ci-later"||a==="ci-drop"){
    const c=S.checkins.find(x=>x.id===id); if(!c) return;
    if(a==="ci-done" && c.link){ save(); location.hash=c.link; return; }
    if(a==="ci-done"){ c.done=true; addEntry({area:c.area, title:"Kleiner Schritt geschafft", text:c.text}); toast("Schön! Das steht jetzt im Journal."); }
    if(a==="ci-later"){ c.due=Date.now()+2*864e5; toast("Ich frage in zwei Tagen noch mal."); }
    if(a==="ci-drop"){ c.done=true; }
    save(); render();
  }
  else if(a.startsWith("los-")) losAction(a,b);
  else if(a.startsWith("erk-")) erkAction(a,b);
  else if(a.startsWith("ord-")) ordAction(a,b);
  else if(a.startsWith("ein-")) einAction(a,b);
  else if(a.startsWith("hab-")) habAction(a,b);
  else if(a.startsWith("int-")) intAction(a,b);
  else if(a.startsWith("fr-")) frAction(a,b);
  else if(a==="export") doExport();
  else if(a==="snooze"){ S.backupSnooze=new Date().toISOString(); save(); render(); }
  else if(a==="import") document.getElementById("importFile").click();
  else if(a==="wipe"){ ui.confirmWipe=true; render(); }
  else if(a==="wipe-no"){ ui.confirmWipe=false; render(); }
  else if(a==="wipe-yes"){ S=fresh(); save(); ui.confirmWipe=false; toast("Alles gelöscht."); render(); }
});
app.addEventListener("input", e=>{
  if(e.target.id==="erkIn"){ const er=document.getElementById("erkErr"); if(er) er.textContent=""; }
  if(e.target.id==="losVal"){ const o=document.getElementById("losValOut"); if(o) o.textContent=fmtV(parseFloat(e.target.value)); }
  if(e.target.id==="losErrSrc"){ const er=document.getElementById("losErr"); if(er) er.textContent=""; }
  if(e.target.id==="nx"){ const er=document.getElementById("nerr"); if(er) er.textContent=""; } });

render();
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
