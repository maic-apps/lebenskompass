<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lebenskompass</title>
<meta name="theme-color" content="#F6F3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lebenskompass">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#F6F3EC; --card:#FFFFFF; --ink:#1F2A28; --muted:#5C6360; --line:#DDD7CA; --soft:#EFEBE2;
  --accent:#0F5E4B; --accent-ink:#FFFFFF; --accent-soft:#E4F4EE; --accent-2:#7CCFB2; --warm:#5C5347;
  --danger:#A3372D;
  --sea:#DCE9EC; --wave:#BFD5DA; --isle0:#EEEBE2; --isle2:#D6E8C8; --isle3:#B7D8A4; --isle-line:#6E9C6A; --tree:#5E9A5A; --fog:#F3F1EB;
  --serif: "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141917; --card:#1D2421; --ink:#ECEFEC; --muted:#A7B0AC; --line:#2F3934; --soft:#232B28;
    --accent:#5CC6A2; --accent-ink:#0B1F19; --accent-soft:#1E3A31; --accent-2:#2F7A62; --warm:#C9C0B2;
    --danger:#F08A7E;
    --sea:#1B2B30; --wave:#2A4047; --isle0:#2A302D; --isle2:#2F4A36; --isle3:#3E6B47; --isle-line:#7FB08A; --tree:#8CC79A; --fog:#3A403D;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:18px;min-height:100vh}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.15;margin:0}
h2{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.2;margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.kicker{font-size:13px;font-weight:600;color:var(--accent)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.back{height:44px;display:flex;align-items:center;font-size:16px;font-weight:600;text-decoration:none;color:var(--accent);background:none;border:none;padding:0}
.pill{height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:transparent;font-size:15px;color:var(--muted)}
.btn{height:52px;border-radius:26px;border:none;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:600;width:100%}
.btn.sm{height:44px;width:auto;padding:0 20px;font-size:16px}
.btn.line{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn.quiet{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:400}
.btn.danger{background:var(--danger);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.soft{background:var(--soft);border-radius:14px;padding:14px 16px;color:var(--warm);font-size:15px;line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* compass */
.compass{position:relative;width:340px;height:320px;margin:0 auto}
.compass svg{position:absolute;left:80px;top:70px}
.dir{padding:0 6px}
.dir{position:absolute;height:48px;border-radius:24px;border:1px solid var(--accent);background:var(--card);color:var(--accent);font-size:16px;font-weight:600}
.dir.on{background:var(--accent);color:var(--accent-ink)}
.dir.n{left:125px;top:0;width:90px}.dir.e{left:248px;top:136px;width:92px}.dir.s{left:125px;top:272px;width:90px}.dir.w{left:0;top:136px;width:84px}
.center{position:absolute;left:134px;top:124px;width:72px;height:72px;border-radius:36px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;font-weight:600}
.center.on{background:var(--ink);color:var(--bg)}
@media (max-width:370px){.compass{transform:scale(.88);transform-origin:top center;margin-bottom:-38px}}
/* journal */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day{display:flex;flex-direction:column;gap:10px}
.day>.label{font-size:13px;font-weight:600;color:var(--muted)}
.entry{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.entry .body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.entry .title{font-size:16px;font-weight:600}
.entry .text{font-size:15px;line-height:1.45;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
.entry .del{align-self:flex-start;background:none;border:none;color:var(--muted);font-size:13px;padding:6px 0;min-height:32px;text-decoration:underline}
.entry .del.confirm{color:var(--danger);font-weight:600}
.ico{flex-shrink:0}
label.f{font-family:var(--serif);font-size:19px;font-weight:600}
input.t,textarea.t{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);line-height:1.4}
input.t{height:48px}
textarea.t{resize:vertical;min-height:120px}
/* pause */
.breath{width:200px;height:200px;margin:8px auto;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;transform:scale(.7);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1)}
.breath.out{transform:scale(.7);transition-duration:6s}
.breath span{font-family:var(--serif);font-size:22px;color:var(--accent)}
@media (prefers-reduced-motion: reduce){.breath,.breath.in,.breath.out{transition:none;transform:none}}
.help a{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:16px}
.help a b{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:22px;font-size:15px;max-width:90%;text-align:center;z-index:9}
/* loslassen */
.range{width:100%;height:44px;accent-color:var(--accent)}
.big{font-family:var(--serif);font-size:60px;font-weight:600;color:var(--accent);text-align:center;line-height:1.1}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:-6px}
.steps{display:flex;gap:4px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--accent)}
.phases{display:flex;flex-direction:column;gap:10px}
.phases div{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:3px solid var(--accent-2);border-radius:0}
.phases b{font-size:15px}.phases span{font-size:14px;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted);text-align:center}
.linkbtn{background:none;border:none;color:var(--muted);font-size:15px;text-decoration:underline;min-height:44px;padding:0 4px;align-self:center}
.warn{border-color:var(--danger)}
.chart{width:100%;height:auto;display:block}
.rounds{display:flex;flex-direction:column;gap:10px}
.rounds .r{display:flex;gap:12px;align-items:flex-start}
.rounds .n{flex-shrink:0;width:30px;height:30px;border-radius:15px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
/* interesse */
.map{position:relative;width:358px;height:400px;margin:0 auto;border-radius:18px;overflow:hidden;background:var(--sea)}
.map svg{position:absolute;left:0;top:0}
.isle-btn{position:absolute;border:none;background:transparent;padding:0;border-radius:40%}
@media (max-width:370px){.map{transform:scale(.88);transform-origin:top center;margin-bottom:-48px}}
.bigcard{background:var(--card);border:1px solid var(--line);border-radius:22px;min-height:240px;display:flex;align-items:center;justify-content:center;padding:28px 24px;text-align:center;font-family:var(--serif);font-size:24px;line-height:1.3}
.mode{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;font-size:14px;min-height:28px}
.mode .track{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.mode .track span{display:block;height:100%;background:var(--accent);border-radius:4px}
.chip.dream{display:inline-flex;align-items:center;gap:2px;padding-right:2px}
.chip.dream .x{background:none;border:none;font-size:18px;color:var(--muted);width:32px;height:32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main id="app" class="wrap" aria-live="polite"></main>
<input type="file" id="importFile" accept=".json,application/json" class="sr" aria-label="Sicherung auswählen">
<script>
"use strict";
/* ---------- Daten ---------- */
const KEY = "lebenskompass.v1";
const VERSION = "Etappe 4";
const DIRS = {
  erkennen:  { name:"Erkennen",  pos:"n", rot:0,   kicker:"Oben · Beginn", text:"Was hält dich gerade ab? Welche stille Regel bremst dich?", cta:"Starten" },
  loslassen: { name:"Loslassen", pos:"e", rot:90,  kicker:"Rechts", text:"Stärke einschätzen, Gefühl benennen, im Körper beschreiben, dabeibleiben, bis es nachlässt.", cta:"Runde beginnen" },
  interesse: { name:"Interesse", pos:"s", rot:180, kicker:"Unten", text:"Entdecke, was dich anzieht, und brich zu einer kleinen Expedition auf.", cta:"Zur Entdeckerkarte" },
  freude:    { name:"Freude",    pos:"w", rot:270, kicker:"Links", text:"Einen schönen Moment festhalten, die Essenz deiner Freude finden oder Neues ausprobieren.", cta:"Starten" }
};
const ORDER = ["erkennen","loslassen","interesse","freude"];

function fresh(){ return { v:1, entries:[], checkins:[], lastBackup:null, backupSnooze:null, created:new Date().toISOString() }; }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && Array.isArray(d.entries)) return Object.assign(fresh(), d);
  }catch(e){}
  return fresh();
}
let S = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast("Speichern hat nicht geklappt."); return false; }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* Schnittstelle für alle Bereiche: ein Eintrag ins gemeinsame Journal */
function addEntry({area="notiz", title="", text="", meta=null, date=null}){
  const e = { id:uid(), date:date||new Date().toISOString(), area, title:String(title).trim(), text:String(text).trim(), meta };
  S.entries.push(e); save(); return e;
}
/* Schnittstelle für sanfte Nachfragen (z. B. „Wie war dein kleiner Schritt?“) */
function addCheckin({area, text, inDays=3, link=null}){
  S.checkins.push({ id:uid(), area, text, link, due:Date.now() + inDays*864e5, done:false }); save();
}

/* ---------- Helfer ---------- */
const app = document.getElementById("app");
let ui = { sel:null, filter:"alle", confirmDel:null, confirmWipe:false };
let breathTimer = null;

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function dayKey(d){ const x=new Date(d); return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate(); }
function shortDate(d){ const x=new Date(d); return x.getDate()+"."+(x.getMonth()+1)+"."; }
function dayLabel(d){
  const now=new Date(), y=new Date(now); y.setDate(now.getDate()-1);
  if(dayKey(d)===dayKey(now)) return "Heute · "+shortDate(d);
  if(dayKey(d)===dayKey(y)) return "Gestern · "+shortDate(d);
  return new Date(d).toLocaleDateString("de-DE",{weekday:"short"}).replace(".","")+" · "+shortDate(d);
}
function time(d){ return new Date(d).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }
function daysSince(iso){ return iso ? (Date.now()-new Date(iso).getTime())/864e5 : Infinity; }
function areaName(a){ return DIRS[a] ? DIRS[a].name : "Notiz"; }

let toastT=null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600);
}

function icon(area){
  if(!DIRS[area]) return `<svg class="ico" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="var(--soft)"/><circle cx="14" cy="14" r="4" fill="var(--muted)"/></svg>`;
  return `<svg class="ico" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="var(--accent-soft)"/><g transform="rotate(${DIRS[area].rot} 14 14)"><polygon points="14,4 18,14 14,12 10,14" fill="var(--accent)"/><polygon points="14,24 18,14 14,16 10,14" fill="var(--accent-2)"/></g></svg>`;
}
const ROSE = `<svg width="180" height="180" viewBox="0 0 200 200" aria-hidden="true">
<circle cx="100" cy="100" r="96" fill="none" stroke="var(--line)" stroke-width="1.2"/>
<circle cx="100" cy="100" r="90" fill="none" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="2 5"/>
<polygon points="100,12 113,87 100,100" fill="var(--accent)"/><polygon points="100,12 87,87 100,100" fill="var(--accent-2)"/>
<polygon points="188,100 113,87 100,100" fill="var(--accent-2)"/><polygon points="188,100 113,113 100,100" fill="var(--accent)"/>
<polygon points="100,188 113,113 100,100" fill="var(--accent-2)"/><polygon points="100,188 87,113 100,100" fill="var(--accent)"/>
<polygon points="12,100 87,87 100,100" fill="var(--accent)"/><polygon points="12,100 87,113 100,100" fill="var(--accent-2)"/></svg>`;

/* ---------- Bildschirme ---------- */
function screenStart(){
  const today = new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const due = S.checkins.find(c=>!c.done && c.due<=Date.now());
  const backupDue = S.entries.length>0 && daysSince(S.lastBackup||S.created)>=30 && daysSince(S.backupSnooze)>=7;
  const sel = ui.sel;
  const info = sel==="journal"
    ? { kicker:"Mitte", name:"Journal", text:"Alle Einträge aus den vier Richtungen, nach Tagen sortiert.", cta:"Journal öffnen" }
    : sel ? DIRS[sel] : null;
  const pool = S.entries.filter(e=>dayKey(e.date)!==dayKey(new Date()));
  const mem = (pool.length?pool:S.entries);
  const m = mem.length ? mem[Math.floor(Math.random()*mem.length)] : null;

  return `
  <div class="bar">
    <div><div class="muted small">${esc(today)}</div></div>
    <button class="pill" data-act="go" data-to="#/pause">Pause</button>
  </div>
  <h1>Wohin geht's heute?</h1>
  ${due ? `<div class="card">
      <div class="kicker">Sanfte Nachfrage · ${esc(areaName(due.area))}</div>
      <h2>${due.area==="interesse"?"Wie war deine Expedition?":"Wie war dein kleiner Schritt?"}</h2>
      <div class="muted">„${esc(due.text)}“</div>
      <div class="row" style="margin-top:6px">
        <button class="btn sm" data-act="ci-done" data-id="${due.id}">Hab ich gemacht</button>
        <button class="btn sm quiet" data-act="ci-later" data-id="${due.id}">Noch nicht</button>
        <button class="btn sm quiet" data-act="ci-drop" data-id="${due.id}">Nicht mehr wichtig</button>
      </div></div>` : ""}
  ${backupDue ? `<div class="card">
      <div class="kicker">Datensicherung</div>
      <div>Dein letzter Stand ist über einen Monat alt. Magst du kurz sichern?</div>
      <div class="row" style="margin-top:6px">
        <button class="btn sm" data-act="export">Jetzt sichern</button>
        <button class="btn sm quiet" data-act="snooze">Später</button>
      </div></div>` : ""}
  <div class="compass">
    ${ROSE}
    ${ORDER.map(k=>`<button class="dir ${DIRS[k].pos} ${sel===k?"on":""}" data-act="sel" data-k="${k}" aria-pressed="${sel===k}">${DIRS[k].name}</button>`).join("")}
    <button class="center ${sel==="journal"?"on":""}" data-act="sel" data-k="journal" aria-pressed="${sel==="journal"}" aria-label="Journal">Journal</button>
  </div>
  <div class="card" style="min-height:150px">
    ${info ? `
      <div class="kicker">${esc(info.kicker)}</div>
      <h2>${esc(info.name)}</h2>
      <div class="muted" style="line-height:1.45">${esc(info.text)}</div>
      <button class="btn sm" style="align-self:flex-start;margin-top:8px" data-act="go" data-to="${sel==="journal"?"#/journal":"#/bereich/"+sel}">${esc(info.cta)}</button>`
    : `<div class="kicker">Lebenskompass</div><h2>Tippe auf eine Richtung</h2>
       <div class="muted">Oder in die Mitte, um dein Journal zu lesen.</div>`}
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="small muted" style="font-weight:600">Eine Erinnerung für dich</div>
    ${m ? `<div class="entry">${icon(m.area)}<div class="body">
        <div class="kicker">${esc(areaName(m.area))} · ${esc(shortDate(m.date))}</div>
        ${m.title?`<div class="title">${esc(m.title)}</div>`:""}
        <div class="text">${esc(m.text)}</div></div></div>`
      : `<div class="soft">Hier erscheint bald eine Erinnerung aus deinem Journal.</div>`}
  </div>
  <div style="text-align:center;margin-top:auto"><button class="back" style="margin:0 auto" data-act="go" data-to="#/mehr">Sichern &amp; Einstellungen</button></div>`;
}

function screenJournal(){
  const f = ui.filter;
  const list = S.entries.filter(e=>f==="alle" || e.area===f).sort((a,b)=>b.date.localeCompare(a.date));
  const days=[]; list.forEach(e=>{ const k=dayKey(e.date); let d=days.find(x=>x.k===k); if(!d){ d={k,label:dayLabel(e.date),items:[]}; days.push(d);} d.items.push(e); });
  const filters=[["alle","Alle"],...ORDER.map(k=>[k,DIRS[k].name]),["notiz","Notizen"]];
  return `
  <div class="bar"><button class="back" data-act="go" data-to="#/">‹ Kompass</button><span class="kicker">Mitte</span><button class="pill" data-act="go" data-to="#/pause">Pause</button></div>
  <div class="bar"><h1>Dein Journal</h1><button class="btn sm line" data-act="go" data-to="#/notiz">+ Notiz</button></div>
  <div class="chips">${filters.map(([k,l])=>`<button class="chip ${f===k?"on":""}" data-act="filter" data-k="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>
  ${days.length ? days.map(d=>`<section class="day"><div class="label">${esc(d.label)}</div>
      ${d.items.map(e=>`<article class="entry">${icon(e.area)}<div class="body">
        <div class="kicker">${esc(areaName(e.area))} · ${esc(time(e.date))}</div>
        ${e.title?`<div class="title">${esc(e.title)}</div>`:""}
        ${e.text?`<div class="text">${esc(e.text)}</div>`:""}
        <button class="del ${ui.confirmDel===e.id?"confirm":""}" data-act="del" data-id="${e.id}">${ui.confirmDel===e.id?"Wirklich löschen?":"Löschen"}</button>
      </div></article>`).join("")}</section>`).join("")
    : `<div class="soft">${S.entries.length ? "Aus dieser Richtung gibt es noch keinen Eintrag." : "Noch keine Einträge. Jeder Bereich endet mit „Ins Journal“. Du kannst auch jederzeit eine eigene Notiz schreiben."}</div>`}`;
}

function screenNotiz(){
  return `
  <div class="bar"><button class="back" data-act="go" data-to="#/journal">‹ Journal</button><span class="kicker">Notiz</span><span style="width:64px"></span></div>
  <h1>Eine Notiz</h1>
  <div style="display:flex;flex-direction:column;gap:6px"><label class="f" for="nt">Überschrift <span class="muted small" style="font-family:var(--sans);font-weight:400">(optional)</span></label>
    <input class="t" id="nt" maxlength="80" autocomplete="off"></div>
  <div style="display:flex;flex-direction:column;gap:6px"><label class="f" for="nx">Was möchtest du festhalten?</label>
    <textarea class="t" id="nx" rows="6"></textarea>
    <div id="nerr" class="small" style="color:var(--danger);min-height:18px"></div></div>
  <button class="btn" data-act="save-note" style="margin-top:auto">Ins Journal</button>`;
}

function screenBereich(k){
  const d = DIRS[k]; if(!d) { location.hash="#/"; return ""; }
  const stage = {erkennen:3, loslassen:2, interesse:4, freude:5}[k];
  return `
  <div class="bar"><button class="back" data-act="go" data-to="#/">‹ Kompass</button><span class="kicker">${d.name}</span><button class="pill" data-act="go" data-to="#/pause">Pause</button></div>
  <h1>${d.name}</h1>
  <div class="muted" style="line-height:1.5">${esc(d.text)}</div>
  <div class="soft">Dieser Bereich kommt in Etappe ${stage}. Bis dahin kannst du im Journal schon eigene Notizen festhalten.</div>
  <button class="btn line" data-act="go" data-to="#/notiz">Notiz schreiben</button>`;
}

/* ---------- Loslassen (Etappe 2) ---------- */
let losTick = null;
const LOS_NAMES = ["Angst","Traurigkeit","Wut","Scham","Einsamkeit","Unsicherheit","Enge","Leere","Unruhe","Schuld","Ohnmacht"];
const LOS_BODY = ["Brust","Bauch","Hals","Kiefer","Schultern","eng","schwer","warm","kalt","drückend","ziehend","kribbelnd","pochend","hohl"];
function uniqCI(arr){ const seen=new Set(); return arr.filter(x=>{ if(!x) return false; const k=x.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; }); }
function learnWord(listKey, word, defaults){
  const w=String(word).trim(); if(!w || defaults.some(d=>d.toLowerCase()===w.toLowerCase())) return;
  S[listKey] = uniqCI([w].concat(S[listKey]||[])).slice(0,8);
}
function fmtV(v){ return String(v).replace(".",","); }
function losNew(){ return { begun:new Date().toISOString(), situation:"", rounds:[], cur:null, step:"arrive", final:null, closing:"" }; }
function losSteps(n){ return `<div class="steps" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>`; }
function losBar(){
  return `<div class="bar"><button class="back" data-act="go" data-to="#/">‹ Kompass</button><span class="kicker">Loslassen</span><button class="pill" data-act="go" data-to="#/pause">Pause</button></div>`;
}
function losCancel(){
  return ui.losConfirmCancel
    ? `<div class="row" style="justify-content:center"><button class="btn sm danger" data-act="los-cancel-yes">Ja, abbrechen</button><button class="btn sm quiet" data-act="los-cancel-no">Weitermachen</button></div>`
    : `<button class="linkbtn" data-act="los-cancel">Sitzung abbrechen</button>`;
}
function losRange(val){
  return `<div class="big" id="losValOut" aria-hidden="true">${fmtV(val)}</div>
    <label class="sr" for="losVal">Stärke von 0 bis 10</label>
    <input class="range" type="range" id="losVal" min="0" max="10" step="0.5" value="${val}">
    <div class="scale"><span>0 · kaum spürbar</span><span>10 · sehr stark</span></div>`;
}
function losDuration(L){ return Math.max(1, Math.round((Date.now()-new Date(L.begun).getTime())/60000)); }

function screenLos(){
  const L = S.los;
  if(ui.losBackfill) return screenLosBackfill();
  if(!L) return screenLosIntro();
  if(!ui.losResumeOk && (Date.now()-new Date(L.begun).getTime()) > 6*36e5){
    return `${losBar()}<h1>Angefangene Sitzung</h1>
      <div class="muted" style="line-height:1.5">Du hast am ${esc(new Date(L.begun).toLocaleDateString("de-DE"))} eine Sitzung begonnen${L.rounds.length?` und ${L.rounds.length} Runde${L.rounds.length>1?"n":""} geschafft`:""}.</div>
      <button class="btn" data-act="los-resume">Fortsetzen</button>
      <button class="btn quiet" data-act="los-cancel-yes">Verwerfen und neu beginnen</button>`;
  }
  const n = L.rounds.length + 1;
  const kick = `<div class="kicker">Runde ${n}</div>`;
  switch(L.step){
  case "arrive": return screenLosIntro();
  case "check": {
    const def = L.cur && L.cur.start!=null ? L.cur.start : (L.rounds.length ? L.rounds[L.rounds.length-1].start : 5);
    return `${losBar()}${losSteps(1)}${kick}
      <h1>Wie stark ist das Gefühl gerade?</h1>
      ${losRange(def)}
      ${ui.losWarn ? `<div class="card warn"><div class="kicker" style="color:var(--danger)">Das ist sehr stark</div>
          <div class="muted" style="line-height:1.45">Du darfst jetzt auch erst eine Pause machen. Die Sitzung wartet auf dich.</div>
          <div class="row" style="margin-top:6px"><button class="btn sm" data-act="go" data-to="#/pause">Zur Pause</button><button class="btn sm quiet" data-act="los-check-anyway">Ich bleibe dabei</button></div></div>`
        : `<button class="btn" data-act="los-check">Weiter</button>`}
      ${losCancel()}`;
  }
  case "name": {
    const prev = L.rounds.length ? L.rounds[L.rounds.length-1].name : "";
    return `${losBar()}${losSteps(2)}${kick}
      <h1>Wie heißt das Gefühl in dieser Runde?</h1>
      <div class="muted" style="line-height:1.45">Das ist die Überschrift für diese Runde. Es darf auch ein anderes Gefühl sein als eben.</div>
      <input class="t" id="losErrSrc" maxlength="40" autocomplete="off" value="${esc(L.cur.name||"")}" aria-label="Name des Gefühls" placeholder="${prev?esc("Letzte Runde: "+prev):"z. B. Einsamkeit"}">
      <div class="chips">${uniqCI([prev].concat(S.myFeelings||[], LOS_NAMES)).map(x=>`<button class="chip" data-act="los-pick" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <div id="losErr" class="small" style="color:var(--danger);min-height:18px"></div>
      <button class="btn" data-act="los-name">Weiter</button>
      ${losCancel()}`;
  }
  case "body":
    return `${losBar()}${losSteps(3)}${kick}
      <h1>Wo spürst du „${esc(L.cur.name)}“ im Körper?</h1>
      <div class="muted" style="line-height:1.45">Beschreibe es so konkret wie möglich: Ort, Größe, Form, Temperatur, Druck, Bewegung.</div>
      <textarea class="t" id="losErrSrc" rows="4" aria-label="Beschreibung im Körper" placeholder="z. B. ein fester, warmer Druck mitten in der Brust, so groß wie eine Faust">${esc(L.cur.body||"")}</textarea>
      <div class="chips">${uniqCI((S.myBody||[]).concat(LOS_BODY)).map(x=>`<button class="chip" data-act="los-add" data-v="${esc(x)}">+ ${esc(x)}</button>`).join("")}</div>
      <div id="losErr" class="small" style="color:var(--danger);min-height:18px"></div>
      <button class="btn" data-act="los-body">Weiter</button>
      ${losCancel()}`;
  case "stay":
    return `${losBar()}${losSteps(4)}${kick}
      <h1>${esc(L.cur.name)}</h1>
      <div class="soft">${esc(L.cur.body)}</div>
      <div class="phases">
        <div><b>Wahrnehmen statt Denken</b><span>Bleib beim Körper, nicht bei der Geschichte dazu.</span></div>
        <div><b>Erlauben statt Bekämpfen</b><span>Es darf genau so da sein, wie es ist.</span></div>
        <div><b>Durchfühlen &amp; Entladen</b><span>Lass die Welle kommen. Sie geht auch wieder.</span></div>
      </div>
      <div class="muted small" style="line-height:1.45">Der Körper kann diese Spannung nicht dauerhaft halten. Bleib dabei, bis es sich merklich verändert.</div>
      <div class="timer" id="losTimer" aria-live="off">0:00</div>
      <button class="btn" data-act="los-changed">Es hat sich verändert</button>
      ${losCancel()}`;
  case "after":
    return `${losBar()}${kick}
      <h1>Was hat sich verändert?</h1>
      <div class="muted" style="line-height:1.45">Ein Satz reicht. Du kannst das Feld auch leer lassen.</div>
      <textarea class="t" id="losChange" rows="3" aria-label="Was hat sich verändert" placeholder="z. B. Der Druck ist weicher geworden und nach unten gewandert">${esc(L.cur.change||"")}</textarea>
      <button class="btn" data-act="los-next">Nächste Runde</button>
      <button class="btn line" data-act="los-finish">Abschließen</button>`;
  case "final": {
    const last = L.rounds.length ? L.rounds[L.rounds.length-1].start : 5;
    return `${losBar()}<div class="kicker">Abschluss</div>
      <h1>Wie stark ist es jetzt zum Schluss?</h1>
      ${losRange(L.final!=null?L.final:Math.max(0,last-1))}
      <label class="f" for="losClosing" style="margin-top:8px">Was nimmst du mit? <span class="muted small" style="font-family:var(--sans);font-weight:400">(optional)</span></label>
      <textarea class="t" id="losClosing" rows="3">${esc(L.closing||"")}</textarea>
      <button class="btn" data-act="los-summary">Zur Zusammenfassung</button>`;
  }
  case "summary": return screenLosSummary();
  }
  return screenLosIntro();
}

function screenLosIntro(){
  return `${losBar()}
    <h1>Komm kurz an.</h1>
    <div class="muted" style="line-height:1.5">Setz dich bequem hin. Spür, wie dein Körper getragen wird. Atme zwei, drei Mal langsam aus.</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label class="f" for="losSit">Was lässt du heute los? <span class="muted small" style="font-family:var(--sans);font-weight:400">(optional)</span></label>
      <input class="t" id="losSit" maxlength="80" autocomplete="off" value="${esc(S.los?S.los.situation:"")}" placeholder="z. B. Streit am Telefon">
    </div>
    <div class="soft small">In jeder Runde: Stärke einschätzen, Gefühl benennen, im Körper beschreiben, dabeibleiben, bis es nachlässt.</div>
    <button class="btn" data-act="los-start">Erste Runde beginnen</button>
    <button class="linkbtn" data-act="los-backfill">Eine Sitzung nachtragen</button>`;
}

function screenLosBackfill(){
  const d=new Date(), today=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  return `${losBar()}<div class="kicker">Nachtragen</div>
    <h1>Eine Sitzung nachtragen</h1>
    <div style="display:flex;flex-direction:column;gap:6px"><label class="f" for="bfDate">Wann?</label>
      <input class="t" type="date" id="bfDate" value="${today}" max="${today}"></div>
    <div style="display:flex;flex-direction:column;gap:6px"><label class="f" for="bfSit">Was hast du losgelassen?</label>
      <input class="t" id="bfSit" maxlength="80" autocomplete="off"></div>
    <div style="display:flex;flex-direction:column;gap:6px"><label class="f" for="losErrSrc">Gefühle und Runden</label>
      <textarea class="t" id="losErrSrc" rows="4" placeholder="z. B. Einsamkeit 8 → Traurigkeit 5 → Leere 2"></textarea>
      <div id="losErr" class="small" style="color:var(--danger);min-height:18px"></div></div>
    <button class="btn" data-act="los-bf-save">Ins Journal</button>
    <button class="linkbtn" data-act="los-bf-cancel">Abbrechen</button>`;
}

function losChart(vals){
  const W=320,H=150,l=28,r=12,t=12,b=26, n=vals.length;
  const x=i=> n===1 ? (l+W-r)/2 : l + i*(W-l-r)/(n-1);
  const y=v=> t + (10-v)*(H-t-b)/10;
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const labels=vals.map((v,i)=>`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${i===n-1?"Ende":"R"+(i+1)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf der Stärke: ${vals.map(fmtV).join(", ")}">
    <line x1="${l}" y1="${y(10)}" x2="${W-r}" y2="${y(10)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <line x1="${l}" y1="${y(0)}" x2="${W-r}" y2="${y(0)}" stroke="var(--line)"/>
    <text x="${l-8}" y="${y(10)+4}" text-anchor="end" font-size="11" fill="var(--muted)">10</text>
    <text x="${l-8}" y="${y(0)+4}" text-anchor="end" font-size="11" fill="var(--muted)">0</text>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4.5" fill="var(--accent)"/>`).join("")}
    ${labels}</svg>`;
}

function screenLosSummary(){
  const L=S.los, mins=L.minutes||losDuration(L);
  const vals=L.rounds.map(r=>r.start).concat([L.final]);
  return `${losBar()}<div class="kicker">${L.rounds.length} Runde${L.rounds.length>1?"n":""} · ${mins} Minute${mins>1?"n":""}</div>
    <h1>Geschafft.</h1>
    ${L.situation?`<div class="muted">${esc(L.situation)}</div>`:""}
    <div class="card">${losChart(vals)}</div>
    <div class="rounds">${L.rounds.map((r,i)=>`<div class="r"><div class="n">${i+1}</div><div class="body" style="display:flex;flex-direction:column;gap:2px">
      <div style="font-weight:600">${esc(r.name)} · ${fmtV(r.start)}</div>
      <div class="muted small" style="line-height:1.4">${esc(r.body)}</div>
      ${r.change?`<div class="small" style="line-height:1.4">→ ${esc(r.change)}</div>`:""}</div></div>`).join("")}
      <div class="r"><div class="n">✓</div><div style="font-weight:600;padding-top:4px">Zum Schluss · ${fmtV(L.final)}</div></div>
    </div>
    ${L.closing?`<div class="soft">${esc(L.closing)}</div>`:""}
    <button class="btn" data-act="los-save">Ins Journal</button>
    ${ui.losConfirmDiscard
      ? `<div class="row" style="justify-content:center"><button class="btn sm danger" data-act="los-discard-yes">Ohne Speichern beenden</button><button class="btn sm quiet" data-act="los-discard-no">Zurück</button></div>`
      : `<button class="linkbtn" data-act="los-discard">Ohne Speichern beenden</button>`}`;
}

function losAfterRender(){
  const L=S.los;
  if(L && L.step==="stay" && L.cur && L.cur.stayStart){
    const el=document.getElementById("losTimer");
    const upd=()=>{ if(!el) return; const s=Math.floor((Date.now()-L.cur.stayStart)/1000); el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
    upd(); losTick=setInterval(upd,1000);
  }
}
function losErr(msg){ const e=document.getElementById("losErr"); if(e) e.textContent=msg; const f=document.getElementById("losErrSrc"); if(f) f.focus(); }
function losGo(step){ S.los.step=step; save(); ui.losWarn=false; ui.losConfirmCancel=false; render(); window.scrollTo(0,0); }

function losAction(a,b){
  const L=S.los;
  if(a==="los-start"){
    const sit=(document.getElementById("losSit")||{}).value||"";
    S.los=losNew(); S.los.situation=sit.trim(); S.los.cur={start:null,name:"",body:"",change:""}; ui.losResumeOk=true; losGo("check");
  }
  else if(a==="los-resume"){ ui.losResumeOk=true; render(); }
  else if(a==="los-check"||a==="los-check-anyway"){
    const v=parseFloat(document.getElementById("losVal").value);
    L.cur.start=v; save();
    if(a==="los-check" && v>=9){ ui.losWarn=true; render(); return; }
    losGo("name");
  }
  else if(a==="los-pick"){ const f=document.getElementById("losErrSrc"); f.value=b.dataset.v; losErr(""); }
  else if(a==="los-add"){ const f=document.getElementById("losErrSrc"); f.value=(f.value.trim()?f.value.trim()+", ":"")+b.dataset.v; losErr(""); }
  else if(a==="los-name"){
    const v=document.getElementById("losErrSrc").value.trim();
    if(!v){ losErr("Gib dem Gefühl einen Namen, ein Wort reicht."); return; }
    L.cur.name=v; learnWord("myFeelings", v, LOS_NAMES); losGo("body");
  }
  else if(a==="los-body"){
    const v=document.getElementById("losErrSrc").value.trim();
    if(!v){ losErr("Beschreibe kurz, wo und wie du es spürst."); return; }
    v.split(/[,;\n]/).map(x=>x.trim()).filter(x=>x && x.length<=20 && x.split(/\s+/).length<=2).reverse().forEach(x=>learnWord("myBody", x, LOS_BODY));
    L.cur.body=v; L.cur.stayStart=Date.now(); losGo("stay");
  }
  else if(a==="los-changed"){ L.cur.stayMs=Date.now()-L.cur.stayStart; losGo("after"); }
  else if(a==="los-next"||a==="los-finish"){
    L.cur.change=document.getElementById("losChange").value.trim();
    const {start,name,body,change,stayMs}=L.cur;
    L.rounds.push({start,name,body,change,stayMs:stayMs||0});
    L.cur={start:null,name:"",body:"",change:""};
    losGo(a==="los-next"?"check":"final");
  }
  else if(a==="los-summary"){
    L.final=parseFloat(document.getElementById("losVal").value);
    L.closing=document.getElementById("losClosing").value.trim();
    L.minutes=losDuration(L); losGo("summary");
  }
  else if(a==="los-save"){
    const lines=L.rounds.map((r,i)=>`Runde ${i+1}: ${r.name} · ${fmtV(r.start)}${r.change?` → ${r.change}`:""}`);
    lines.push(`Zum Schluss: ${fmtV(L.final)}`);
    if(L.closing) lines.push("", L.closing);
    addEntry({ area:"loslassen", title:L.situation||"Loslassen", text:lines.join("\n"),
      meta:{ situation:L.situation, rounds:L.rounds, final:L.final, closing:L.closing, minutes:L.minutes } });
    S.los=null; save(); ui.losConfirmDiscard=false; toast("Im Journal festgehalten. Gut gemacht."); location.hash="#/journal";
  }
  else if(a==="los-discard"){ ui.losConfirmDiscard=true; render(); }
  else if(a==="los-discard-no"){ ui.losConfirmDiscard=false; render(); }
  else if(a==="los-discard-yes"){ S.los=null; save(); ui.losConfirmDiscard=false; location.hash="#/"; }
  else if(a==="los-cancel"){ ui.losConfirmCancel=true; render(); }
  else if(a==="los-cancel-no"){ ui.losConfirmCancel=false; render(); }
  else if(a==="los-cancel-yes"){ S.los=null; save(); ui.losConfirmCancel=false; ui.losResumeOk=false; render(); }
  else if(a==="los-backfill"){ ui.losBackfill=true; render(); }
  else if(a==="los-bf-cancel"){ ui.losBackfill=false; render(); }
  else if(a==="los-bf-save"){
    const txt=document.getElementById("losErrSrc").value.trim();
    if(!txt){ losErr("Schreib kurz auf, welche Gefühle da waren."); return; }
    const dv=document.getElementById("bfDate").value; let date=null;
    if(dv){ const [yy,mm,dd]=dv.split("-").map(Number); const now=new Date(); date=new Date(yy,mm-1,dd,now.getHours(),now.getMinutes()).toISOString(); }
    addEntry({ area:"loslassen", title:document.getElementById("bfSit").value.trim()||"Loslassen (nachgetragen)", text:txt, date });
    ui.losBackfill=false; toast("Nachgetragen."); location.hash="#/journal";
  }
}

/* ---------- Erkennen (Etappe 3) ---------- */
const ERK_AREAS = ["Beziehungen","Partnerschaft","Körper","Kreativität","Arbeit & Tun","Gemeinschaft","Abenteuer","Anderes"];
const ERK_BODY = ["Lähmung","Enge","Schwere","Unruhe","Druck","Leere","Kloß im Hals","Bauch zieht sich zusammen"];
const ERK_SENT = ["Das bringt eh nichts","Dafür bin ich zu alt","Was sollen die anderen denken","Das steht mir nicht zu","Ich kann das nicht","Später, wenn …"];
const ERK_STAGE = {1:"Der Wunsch",2:"Der Wunsch",3:"Die Bremse",4:"Die Bremse",5:"Die Bremse",6:"Die Erlaubnis",7:"Die Erlaubnis",71:"Die Erlaubnis"};
function erkNew(){ return { begun:new Date().toISOString(), step:1, areas:[], other:"", wish:"", body:"", sentence:"", rule:"", noRule:false, oldThought:"", options:"", small:"", ask:true }; }
function erkBar(){ return `<div class="bar"><button class="back" data-act="go" data-to="#/">‹ Kompass</button><span class="kicker">Erkennen</span><button class="pill" data-act="go" data-to="#/pause">Pause</button></div>`; }
function erkProg(n){
  const k = n===71?7:n;
  return `<div style="display:flex;flex-direction:column;gap:8px"><div class="steps" aria-hidden="true" style="display:grid;grid-template-columns:repeat(7,1fr)">${[1,2,3,4,5,6,7].map(i=>`<i class="${i<=k?"on":""}"></i>`).join("")}</div>
    <div class="small muted">${ERK_STAGE[n]} · Frage ${k} von 7</div></div>`;
}
function erkCancel(){
  return ui.erkConfirmCancel
    ? `<div class="row" style="justify-content:center"><button class="btn sm danger" data-act="erk-cancel-yes">Ja, abbrechen</button><button class="btn sm quiet" data-act="erk-cancel-no">Weitermachen</button></div>`
    : `<button class="linkbtn" data-act="erk-cancel">Abbrechen</button>`;
}
function erkField(id,val,ph,rows=4){ return `<textarea class="t" id="${id}" rows="${rows}" placeholder="${esc(ph)}">${esc(val||"")}</textarea>`; }
function erkErrBox(){ return `<div id="erkErr" class="small" style="color:var(--danger);min-height:18px"></div>`; }
function erkNav(back=true){ return `<button class="btn" data-act="erk-next">Weiter</button>${back?`<button class="linkbtn" data-act="erk-back">‹ Vorige Frage</button>`:""}`; }
function erkAreaText(E){ return E.areas.map(a=>a==="Anderes"&&E.other?E.other:a).join(" · "); }
function erkOptions(E){ return E.options.split(/\n|;/).map(s=>s.replace(/^[-•*\d.)\s]+/,"").trim()).filter(Boolean); }

function screenErk(){
  const E=S.erk;
  if(!E){
    return `${erkBar()}<h1>Was hält dich ab?</h1>
      <div class="muted" style="line-height:1.5">Sieben Fragen in drei Stufen: dein Wunsch, die Bremse und die Erlaubnis. Nimm dir etwa zehn Minuten. Es gibt kein Richtig oder Falsch.</div>
      <div class="soft small">Wenn etwas zu schwer wird: Oben rechts ist immer die Pause.</div>
      <button class="btn" data-act="erk-start">Beginnen</button>`;
  }
  if(!ui.erkResumeOk && (Date.now()-new Date(E.begun).getTime())>6*36e5){
    return `${erkBar()}<h1>Angefangen am ${esc(new Date(E.begun).toLocaleDateString("de-DE"))}</h1>
      <div class="muted">Du warst bei Frage ${E.step===71?7:Math.min(E.step,7)}.</div>
      <button class="btn" data-act="erk-resume">Fortsetzen</button>
      <button class="btn quiet" data-act="erk-cancel-yes">Verwerfen und neu beginnen</button>`;
  }
  const s=E.step;
  if(s===1) return `${erkBar()}${erkProg(1)}
    <h1>Wo in deinem Leben möchtest du gerade lebendiger sein?</h1>
    <div class="muted">Du kannst mehrere wählen.</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      ${ERK_AREAS.map(a=>{ const on=E.areas.includes(a); return `<button class="chip ${on?"on":""}" style="height:52px;border-radius:14px;font-size:16px" data-act="erk-area" data-v="${esc(a)}" aria-pressed="${on}">${esc(a)}</button>`; }).join("")}
    </div>
    ${E.areas.includes("Anderes")?`<input class="t" id="erkOther" maxlength="40" placeholder="Welcher Bereich?" value="${esc(E.other)}" aria-label="Anderer Bereich">`:""}
    ${erkErrBox()}${erkNav(false)}${erkCancel()}`;
  if(s===2) return `${erkBar()}${erkProg(2)}
    <h1>Was würdest du dort tun, wenn nichts dich aufhielte?</h1>
    <div class="muted small">${esc(erkAreaText(E))}</div>
    ${erkField("erkIn",E.wish,"z. B. Salsa lernen, eine Ausbildung anfangen, jemanden ansprechen")}
    ${erkErrBox()}${erkNav()}${erkCancel()}`;
  if(s===3) return `${erkBar()}${erkProg(3)}
    <h1>Stell dir vor, du machst es. Was passiert in dir, kurz bevor du es <em>nicht</em> tust?</h1>
    <div class="muted" style="line-height:1.45">Spür in den Körper: Wo meldet sich etwas, und wie fühlt es sich an?</div>
    ${erkField("erkIn",E.body,"z. B. eine Lähmung, ein Druck auf der Brust")}
    <div class="chips">${ERK_BODY.map(x=>`<button class="chip" data-act="erk-add" data-v="${esc(x)}">+ ${esc(x)}</button>`).join("")}</div>
    ${erkErrBox()}${erkNav()}
    <div class="card"><div class="kicker">Ist das gerade stark?</div>
      <div class="muted small" style="line-height:1.45">Du kannst erst loslassen und danach hier weitermachen. Deine Antworten bleiben gespeichert.</div>
      <button class="btn sm line" style="align-self:flex-start;margin-top:6px" data-act="erk-to-los">Erst loslassen</button></div>
    ${erkCancel()}`;
  if(s===4) return `${erkBar()}${erkProg(4)}
    <h1>Welcher Satz taucht dann in deinem Kopf auf?</h1>
    ${erkField("erkIn",E.sentence,"Schreib ihn so, wie er in dir klingt",3)}
    <div class="chips">${ERK_SENT.map(x=>`<button class="chip" data-act="erk-fill" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    ${erkErrBox()}${erkNav()}${erkCancel()}`;
  if(s===5) return `${erkBar()}${erkProg(5)}
    <h1>Gibt es ein „erst wenn …“?</h1>
    <div class="muted" style="line-height:1.45">Manchmal steckt hinter der Bremse eine stille Regel. Ergänze den Satz so, wie er sich anfühlt.</div>
    <div class="card"><label class="f" for="erkIn" style="font-weight:400;line-height:1.35">Ich darf das erst genießen oder tun, wenn …</label>
      ${erkField("erkIn",E.rule,"… ",3)}<div class="small muted">Ein Satz reicht.</div></div>
    ${erkErrBox()}
    <button class="btn" data-act="erk-next">Weiter</button>
    <button class="btn quiet" data-act="erk-norule">Da ist keine Regel</button>
    <button class="linkbtn" data-act="erk-back">‹ Vorige Frage</button>${erkCancel()}`;
  if(s===6){
    const what = E.noRule ? `dieser Satz („${E.sentence}“)` : "diese Regel";
    return `${erkBar()}${erkProg(6)}
    <h1>Was würdest du tun, wenn ${esc(what)} nur ein alter Gedanke wäre?</h1>
    ${!E.noRule?`<div class="soft">Ich darf das erst genießen oder tun, wenn ${esc(E.rule)}</div>`:""}
    ${erkField("erkIn",E.oldThought,"Lass dir Zeit. Was wäre dann möglich?")}
    ${erkErrBox()}${erkNav()}${erkCancel()}`;
  }
  if(s===7) return `${erkBar()}${erkProg(7)}
    <h1>Welche Schritte wären trotzdem möglich?</h1>
    <div class="muted" style="line-height:1.45">Auch wenn das „erst wenn“ noch nicht erfüllt ist. Schreib jeden Schritt in eine eigene Zeile.</div>
    ${erkField("erkIn",E.options,"z. B.\nMich zum Salsa anmelden\nBei Instituten nachfragen\nEin Treffen über Meet5 organisieren",5)}
    ${erkErrBox()}${erkNav()}${erkCancel()}`;
  if(s===71){
    const opts=erkOptions(E);
    return `${erkBar()}${erkProg(71)}
    <h1>Welcher davon ist der kleinste, den du diese Woche machen kannst?</h1>
    <div style="display:flex;flex-direction:column;gap:8px">${opts.map(o=>{ const on=E.small===o; return `<button class="chip ${on?"on":""}" style="height:auto;min-height:48px;padding:10px 14px;border-radius:14px;text-align:left;font-size:16px;line-height:1.3" data-act="erk-small" data-v="${esc(o)}" aria-pressed="${on}">${esc(o)}</button>`; }).join("")}</div>
    <label class="small muted" for="erkIn">Oder ein anderer, noch kleinerer Schritt:</label>
    <input class="t" id="erkIn" maxlength="120" value="${esc(opts.includes(E.small)?"":E.small)}" autocomplete="off">
    <label style="display:flex;gap:10px;align-items:center;min-height:44px;font-size:16px"><input type="checkbox" id="erkAsk" ${E.ask?"checked":""} style="width:22px;height:22px;accent-color:var(--accent)"> In drei Tagen sanft nachfragen, wie es war</label>
    ${erkErrBox()}<button class="btn" data-act="erk-next">Zur Zusammenfassung</button><button class="linkbtn" data-act="erk-back">‹ Vorige Frage</button>`;
  }
  /* Zusammenfassung */
  const row=(k,v,serif)=> v?`<div style="display:flex;flex-direction:column;gap:2px"><div class="kicker">${k}</div><div style="${serif?"font-family:var(--serif);font-size:18px;":""}line-height:1.4">${esc(v)}</div></div>`:"";
  return `${erkBar()}<div class="small muted">Geschafft · ${esc(shortDate(new Date()))}</div>
    <h1>Das hast du heute erkannt</h1>
    <div class="card" style="gap:14px">
      ${row("Bereich",erkAreaText(E))}
      ${row("Wunsch",E.wish)}
      ${row("Bremse",E.body)}
      ${row("Der Satz dazu",E.sentence?`„${E.sentence}“`:"",true)}
      ${E.noRule?"":row("Die stille Regel",`„Ich darf das erst genießen oder tun, wenn ${E.rule}“`,true)}
      ${row("Wenn es nur ein alter Gedanke wäre",E.oldThought)}
      ${row("Trotzdem möglich",erkOptions(E).join(" · "))}
      <div style="background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px">
        <div class="kicker">Mein kleiner Schritt diese Woche</div><div style="line-height:1.4">${esc(E.small)}</div></div>
    </div>
    <button class="btn" data-act="erk-save">Ins Journal</button>
    <div class="small muted" style="text-align:center">Hat sich dabei ein starkes Gefühl gezeigt?</div>
    <button class="btn line" data-act="erk-save-los">Ins Journal und zum Loslassen</button>
    <button class="linkbtn" data-act="erk-back">‹ Noch etwas ändern</button>`;
}

function erkErr(msg){ const e=document.getElementById("erkErr"); if(e) e.textContent=msg; const f=document.getElementById("erkIn"); if(f) f.focus(); }
function erkGo(step){ S.erk.step=step; save(); ui.erkConfirmCancel=false; render(); window.scrollTo(0,0); }
function erkSaveEntry(){
  const E=S.erk, L=[];
  L.push("Bereich: "+erkAreaText(E));
  if(E.wish) L.push("Wunsch: "+E.wish);
  if(E.body) L.push("Bremse: "+E.body);
  if(E.sentence) L.push(`Satz: „${E.sentence}“`);
  if(!E.noRule && E.rule) L.push(`Regel: „Ich darf das erst genießen oder tun, wenn ${E.rule}“`);
  if(E.oldThought) L.push("Wenn es nur ein alter Gedanke wäre: "+E.oldThought);
  const o=erkOptions(E); if(o.length) L.push("Trotzdem möglich: "+o.join(" · "));
  L.push("Kleiner Schritt: "+E.small);
  addEntry({ area:"erkennen", title: (!E.noRule && E.rule) ? "Die stille Regel" : "Meine Bremse", text:L.join("\n"), meta:Object.assign({},E) });
  if(E.ask) addCheckin({ area:"erkennen", text:E.small, inDays:3 });
  S.erk=null; save();
}
function erkAction(a,b){
  const E=S.erk;
  const val=()=>{ const f=document.getElementById("erkIn"); return f?f.value.trim():""; };
  if(a==="erk-start"){ S.erk=erkNew(); ui.erkResumeOk=true; save(); render(); }
  else if(a==="erk-resume"){ ui.erkResumeOk=true; render(); }
  else if(a==="erk-area"){ const v=b.dataset.v; const o=document.getElementById("erkOther"); if(o) E.other=o.value; E.areas=E.areas.includes(v)?E.areas.filter(x=>x!==v):E.areas.concat([v]); save(); render(); }
  else if(a==="erk-add"){ const f=document.getElementById("erkIn"); f.value=(f.value.trim()?f.value.trim()+", ":"")+b.dataset.v; erkErr(""); }
  else if(a==="erk-fill"){ const f=document.getElementById("erkIn"); f.value=b.dataset.v; erkErr(""); }
  else if(a==="erk-small"){ const f=document.getElementById("erkIn"); if(f) f.value=""; E.small=b.dataset.v; const ck=document.getElementById("erkAsk"); if(ck) E.ask=ck.checked; save(); render(); }
  else if(a==="erk-norule"){ E.noRule=true; E.rule=""; erkGo(6); }
  else if(a==="erk-back"){
    const s=E.step; const prev = s===8?71 : s===71?7 : Math.max(1,s-1);
    erkGo(prev);
  }
  else if(a==="erk-to-los"){ E.body=val(); save(); location.hash="#/bereich/loslassen"; }
  else if(a==="erk-next"){
    const s=E.step, v=val();
    if(s===1){ const o=document.getElementById("erkOther"); if(o) E.other=o.value.trim();
      if(!E.areas.length) return erkErr("Wähle mindestens einen Bereich.");
      return erkGo(2); }
    if(s===2){ if(!v) return erkErr("Schreib kurz auf, was du tun würdest."); E.wish=v; return erkGo(3); }
    if(s===3){ if(!v) return erkErr("Beschreibe kurz, was in dir passiert."); E.body=v; return erkGo(4); }
    if(s===4){ if(!v) return erkErr("Schreib den Satz auf, oder tippe einen Vorschlag an."); E.sentence=v; return erkGo(5); }
    if(s===5){ if(!v) return erkErr("Ergänze den Satz, oder tippe auf „Da ist keine Regel“."); E.rule=v.replace(/^…\s*/,""); E.noRule=false; return erkGo(6); }
    if(s===6){ if(!v) return erkErr("Ein paar Worte reichen."); E.oldThought=v; return erkGo(7); }
    if(s===7){ if(!v) return erkErr("Schreib mindestens einen Schritt auf."); E.options=v; const o=erkOptions(E); if(!o.includes(E.small)) E.small=o.length===1?o[0]:""; return erkGo(71); }
    if(s===71){ const ck=document.getElementById("erkAsk"); E.ask=ck?ck.checked:true; if(v) E.small=v;
      if(!E.small) return erkErr("Wähle einen Schritt, oder schreib einen eigenen.");
      return erkGo(8); }
  }
  else if(a==="erk-save"){ erkSaveEntry(); toast("Im Journal festgehalten."); location.hash="#/journal"; }
  else if(a==="erk-save-los"){ erkSaveEntry(); toast("Im Journal festgehalten."); location.hash="#/bereich/loslassen"; }
  else if(a==="erk-cancel"){ ui.erkConfirmCancel=true; render(); }
  else if(a==="erk-cancel-no"){ ui.erkConfirmCancel=false; render(); }
  else if(a==="erk-cancel-yes"){ S.erk=null; save(); ui.erkConfirmCancel=false; ui.erkResumeOk=false; render(); }
}

/* ---------- Interesse (Etappe 4) ---------- */
const ROUND_SIZE = 15;
const LEVELS = ["Im Nebel","Gesichtet","Betreten","Erkundet"];
const LEVEL_TXT = ["Noch unentdeckt. Vielleicht wartet hier etwas.","Etwas hat dich hier neugierig gemacht.","Du warst schon dort und hast Spuren hinterlassen.","Hierhin zieht es dich immer wieder."];
function intS(){
  if(!S.int) S.int = { hits:{}, exp:{}, bonus:{}, modes:{}, seen:[], pending:[], dreams:DREAMS.slice(), round:null, rounds:0 };
  return S.int;
}
function isleById(id){ return ISLES.find(i=>i.id===id); }
function isleLevel(id){
  const I=intS(), h=I.hits[id]||0, e=I.exp[id]||0, p=h+2*e+(I.bonus[id]||0);
  if(e>=1 && p>=6) return 3;
  if(e>=1 || p>=3) return 2;
  if(p>=1) return 1;
  return 0;
}
function blob(cx,cy,rx,ry,k){
  const n=8, pts=[];
  for(let j=0;j<n;j++){ const a=j/n*Math.PI*2, f=k[j%k.length]; pts.push([cx+Math.cos(a)*rx*f, cy+Math.sin(a)*ry*f]); }
  const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
  const m0=mid(pts[n-1],pts[0]); let d=`M${m0[0].toFixed(1)} ${m0[1].toFixed(1)}`;
  for(let j=0;j<n;j++){ const p=pts[j], m=mid(p,pts[(j+1)%n]); d+=` Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${m[0].toFixed(1)} ${m[1].toFixed(1)}`; }
  return d+" Z";
}
function intMap(){
  const sel=ui.intSel;
  const lv={}; ISLES.forEach(i=>lv[i.id]=isleLevel(i.id));
  const routes=BRIDGES.filter(([a,b])=>lv[a]>=2&&lv[b]>=2).map(([a,b])=>{ const A=isleById(a),B=isleById(b); return `<line x1="${A.cx}" y1="${A.cy}" x2="${B.cx}" y2="${B.cy}" stroke="#B98A4E" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>`; }).join("");
  const waves=[[20,28],[208,112],[140,392],[312,138],[18,196],[320,318]].map(([x,y])=>`<path d="M${x} ${y} q 8 -5 16 0 t 16 0" fill="none" stroke="var(--wave)" stroke-width="1.5"/>`).join("");
  const isles=ISLES.map(i=>{
    const l=lv[i.id], on=sel===i.id;
    const fill = l>=3?"var(--isle3)":l===2?"var(--isle2)":"var(--isle0)";
    const stroke = l>=2?"var(--isle-line)":"var(--muted)";
    let extra="";
    if(l>=3){ const fx=i.cx+i.rx*.35, fy=i.cy-i.ry*.25;
      extra=`<circle cx="${i.cx-i.rx*.35}" cy="${i.cy+i.ry*.1}" r="5" fill="var(--tree)"/><circle cx="${i.cx-i.rx*.1}" cy="${i.cy+i.ry*.35}" r="4" fill="var(--tree)"/><line x1="${fx}" y1="${fy}" x2="${fx}" y2="${fy-18}" stroke="var(--ink)" stroke-width="1.5"/><path d="M${fx} ${fy-18} l12 4 l-12 4 Z" fill="#D9713C"/>`; }
    if(l===0) extra=`<circle cx="${i.cx}" cy="${i.cy}" r="21" fill="var(--fog)" opacity=".93"/><circle cx="${i.cx-16}" cy="${i.cy+6}" r="16" fill="var(--fog)" opacity=".93"/><circle cx="${i.cx+16}" cy="${i.cy+4}" r="16" fill="var(--fog)" opacity=".93"/>`;
    return `${on?`<ellipse cx="${i.cx}" cy="${i.cy}" rx="${i.rx+6}" ry="${i.ry+6}" fill="none" stroke="var(--accent)" stroke-width="2"/>`:""}
      <path d="${blob(i.cx,i.cy,i.rx,i.ry,i.k)}" fill="${fill}" stroke="${stroke}" stroke-width="1.5" ${l===1?'stroke-dasharray="4 3"':""}/>${extra}
      <text x="${i.cx}" y="${i.cy+i.ry+18}" text-anchor="middle" font-size="12" font-weight="600" fill="${l===0?"var(--muted)":"var(--ink)"}">${esc(i.name)}</text>`;
  }).join("");
  const btns=ISLES.map(i=>`<button class="isle-btn" style="left:${i.cx-i.rx-4}px;top:${i.cy-i.ry-8}px;width:${(i.rx+4)*2}px;height:${i.ry*2+30}px" data-act="int-sel" data-v="${i.id}" aria-pressed="${sel===i.id}" aria-label="${esc(i.name)}, ${LEVELS[lv[i.id]]}"></button>`).join("");
  return `<div class="map"><svg width="358" height="400" viewBox="0 0 358 400" aria-hidden="true">${waves}${routes}${isles}</svg>${btns}</div>`;
}
function intBar(back="#/"){ return `<div class="bar"><button class="back" data-act="${back==="#/"?"go":"int-home"}" data-to="#/">‹ ${back==="#/"?"Kompass":"Karte"}</button><span class="kicker">Interesse</span><button class="pill" data-act="go" data-to="#/pause">Pause</button></div>`; }

function screenInt(){
  const I=intS(), v=ui.intView||"map";
  if(I.round) return screenIntRound();
  if(v==="exp") return screenIntExp();
  if(v==="reflect") return screenIntReflect();
  const sel=ui.intSel ? isleById(ui.intSel) : null;
  const pend=I.pending[0];
  const modeTot=Object.values(I.modes).reduce((a,b)=>a+b,0);
  const topModes=Object.entries(I.modes).sort((a,b)=>b[1]-a[1]).slice(0,3);
  let selCard="";
  if(sel){
    const l=isleLevel(sel.id);
    selCard=`<div class="card"><div class="kicker">${LEVELS[l]}</div><h2>${esc(sel.name)}</h2>
      <div class="muted small" style="line-height:1.45">${LEVEL_TXT[l]}</div>
      ${sel.id==="ferne"?`<div class="small" style="font-weight:600;margin-top:8px">Deine Traumziele</div>
        <div class="chips">${I.dreams.map(d=>`<span class="chip dream">${esc(d)}<button class="x" data-act="int-dream-del" data-v="${esc(d)}" aria-label="${esc(d)} entfernen">×</button></span>`).join("")}</div>
        <div class="row" style="flex-wrap:nowrap"><input class="t" id="intDream" maxlength="30" placeholder="Neues Traumziel" style="height:44px"><button class="btn sm line" data-act="int-dream-add">Dazu</button></div>`:""}
      <button class="btn sm" style="align-self:flex-start;margin-top:8px" data-act="int-exp" data-v="${sel.id}">Expedition</button></div>`;
  }
  return `${intBar()}
    <h1>Deine Entdeckerkarte</h1>
    <div class="muted" style="line-height:1.45;margin-top:-8px">Wo du neugierig warst, lichtet sich der Nebel.</div>
    ${pend?`<div class="card"><div class="kicker">Offene Expedition · ${esc(isleById(pend.isle).name)}</div>
      <div style="line-height:1.45">${esc(pend.text)}</div>
      <div class="row" style="margin-top:6px"><button class="btn sm" data-act="int-done" data-v="${pend.id}">Erledigt – nachspüren</button><button class="btn sm quiet" data-act="int-drop" data-v="${pend.id}">Verwerfen</button></div></div>`:""}
    ${intMap()}
    ${selCard || `<div class="soft small">Tippe auf eine Insel für eine Expedition, oder starte eine Runde mit Karten, damit sich der Nebel lichtet.</div>`}
    <button class="btn" data-act="int-round">Neue Runde · ca. 4 Min.</button>
    ${modeTot?`<div class="card"><div class="kicker">Was dich an Dingen reizt</div>${topModes.map(([m,n])=>`<div class="mode"><span>${MODES[m]}</span><span class="track"><span style="width:${Math.round(n/topModes[0][1]*100)}%"></span></span></div>`).join("")}</div>`:""}`;
}

function intPickRound(){
  const I=intS(); const ids=[];
  const pools={}; ISLES.forEach(i=>{ const all=CARDS[i.id].map((_,n)=>i.id+":"+n); let un=all.filter(x=>!I.seen.includes(x)); if(!un.length){ I.seen=I.seen.filter(x=>!x.startsWith(i.id+":")); un=all; } pools[i.id]=un.sort(()=>Math.random()-.5); });
  const order=ISLES.map(i=>i.id).sort(()=>Math.random()-.5);
  let k=0; while(ids.length<ROUND_SIZE && k<100){ const id=order[k%order.length]; if(pools[id].length) ids.push(pools[id].shift()); k++; }
  return ids.sort(()=>Math.random()-.5);
}
function cardText(ref){ const [id,n]=ref.split(":"); return CARDS[id][+n]; }

function screenIntRound(){
  const R=intS().round;
  if(R.i < R.ids.length){
    const ref=R.ids[R.i];
    return `${intBar("map")}
      <div style="display:flex;flex-direction:column;gap:8px"><div class="steps" aria-hidden="true" style="display:grid;grid-template-columns:repeat(${R.ids.length},1fr)">${R.ids.map((_,n)=>`<i class="${n<R.i?"on":""}"></i>`).join("")}</div>
      <div class="small muted">Karte ${R.i+1} von ${R.ids.length} · spontan, aus dem Bauch</div></div>
      <div class="bigcard"><div>${esc(cardText(ref))}</div></div>
      <div class="row" style="flex-wrap:nowrap">
        <button class="btn quiet" data-act="int-card" data-v="0">Lässt mich kalt</button>
        <button class="btn" data-act="int-card" data-v="1">Zieht mich an</button></div>
      <button class="linkbtn" data-act="int-round-end">Runde vorzeitig beenden</button>`;
  }
  const hits=R.hits, q=R.reflect||0;
  if(q < Math.min(3,hits.length)){
    const ref=hits[q];
    return `${intBar("map")}<div class="kicker">Nachspüren · ${q+1} von ${Math.min(3,hits.length)}</div>
      <h1>Was reizt dich daran?</h1>
      <div class="soft" style="font-family:var(--serif);font-size:18px;color:var(--ink)">${esc(cardText(ref))}</div>
      <div style="display:flex;flex-direction:column;gap:8px">${Object.entries(MODES).map(([k,l])=>`<button class="chip" style="height:48px;border-radius:14px;font-size:16px" data-act="int-mode" data-v="${k}">${l}</button>`).join("")}</div>
      <button class="linkbtn" data-act="int-mode" data-v="">Überspringen</button>`;
  }
  const byIsle={}; hits.forEach(r=>{ const id=r.split(":")[0]; byIsle[id]=(byIsle[id]||0)+1; });
  const list=Object.entries(byIsle).sort((a,b)=>b[1]-a[1]);
  return `${intBar("map")}<div class="kicker">Runde geschafft</div>
    <h1>${hits.length ? "Hier hat sich der Nebel gelichtet" : "Heute hat nichts gezogen"}</h1>
    ${hits.length ? `<div class="card">${list.map(([id,n])=>`<div style="display:flex;justify-content:space-between;gap:8px;min-height:32px;align-items:center"><span>${esc(isleById(id).name)}</span><span class="kicker">${n}× zieht an</span></div>`).join("")}</div>`
      : `<div class="muted" style="line-height:1.45">Auch das ist eine Auskunft. Manchmal braucht Neugier einfach einen anderen Tag.</div>`}
    <button class="btn" data-act="int-round-close">Zur Karte</button>`;
}

function screenIntExp(){
  const x=ui.intExp, isle=isleById(x.isle), I=intS();
  if(x.isle==="ferne" && !x.dream){
    return `${intBar("map")}<div class="kicker">Expedition · Ferne Länder</div>
      <h1>Welches Traumziel?</h1>
      <div class="chips">${I.dreams.map(d=>`<button class="chip" data-act="int-exp-dream" data-v="${esc(d)}">${esc(d)}</button>`).join("")}</div>
      ${I.dreams.length?"":`<div class="soft small">Füge auf der Karte bei „Ferne Länder“ ein Traumziel hinzu.</div>`}`;
  }
  if(x.t==null || x.e==null){
    const ch=(key,vals)=>vals.map((l,n)=>`<button class="chip ${x[key]===n?"on":""}" style="height:48px;flex:1" data-act="int-exp-set" data-k="${key}" data-v="${n}" aria-pressed="${x[key]===n}">${l}</button>`).join("");
    return `${intBar("map")}<div class="kicker">Expedition · ${esc(isle.name)}${x.dream?" · "+esc(x.dream):""}</div>
      <h1>Wie viel hast du gerade?</h1>
      <div class="small" style="font-weight:600">Zeit</div><div class="row" style="flex-wrap:nowrap">${ch("t",["5 Minuten","½ Stunde","½ Tag"])}</div>
      <div class="small" style="font-weight:600">Energie</div><div class="row" style="flex-wrap:nowrap">${ch("e",["wenig","mittel","viel"])}</div>`;
  }
  const size=Math.min(x.t, x.e+1);
  const opts=EXPS[x.isle][size]; const text=opts[(x.alt||0)%opts.length].replace(/\{z\}/g, x.dream||"");
  x.text=text; x.size=size;
  return `${intBar("map")}<div class="kicker">Expedition · ${esc(isle.name)}${x.dream?" · "+esc(x.dream):""}</div>
    <h1>Dein Vorschlag</h1>
    <div class="bigcard" style="min-height:160px"><div>${esc(text)}</div></div>
    <button class="btn" data-act="int-exp-take">Nehme ich mir vor</button>
    <button class="btn quiet" data-act="int-exp-alt">Anderer Vorschlag</button>
    <button class="linkbtn" data-act="int-exp-reset">Zeit und Energie ändern</button>`;
}

function screenIntReflect(){
  const I=intS(), p=I.pending.find(x=>x.id===ui.intReflect); if(!p){ ui.intView="map"; return screenInt(); }
  const m=ui.intMore;
  return `${intBar("map")}<div class="kicker">Nach der Expedition · ${esc(isleById(p.isle).name)}</div>
    <h1>Wie war's?</h1>
    <div class="soft">${esc(p.text)}</div>
    <label class="f" for="intTouch">Was hat dich berührt?</label>
    <textarea class="t" id="intTouch" rows="3"></textarea>
    <label class="f" for="intTell">Wem möchtest du davon erzählen?</label>
    <input class="t" id="intTell" maxlength="60" autocomplete="off" placeholder="Einem Menschen oder einer Gruppe">
    <div class="f">Mehr davon?</div>
    <div class="row" style="flex-wrap:nowrap">${[["ja","Ja"],["vielleicht","Vielleicht"],["nein","Eher nicht"]].map(([k,l])=>`<button class="chip ${m===k?"on":""}" style="height:48px;flex:1" data-act="int-more" data-v="${k}" aria-pressed="${m===k}">${l}</button>`).join("")}</div>
    <div id="intErr" class="small" style="color:var(--danger);min-height:18px"></div>
    <button class="btn" data-act="int-save">Ins Journal</button>`;
}

function intAction(a,b){
  const I=intS(), v=b.dataset.v;
  if(a==="int-home"){ ui.intView="map"; render(); window.scrollTo(0,0); }
  else if(a==="int-sel"){ ui.intSel = ui.intSel===v?null:v; render(); }
  else if(a==="int-round"){ I.round={ ids:intPickRound(), i:0, hits:[], reflect:0 }; save(); render(); window.scrollTo(0,0); }
  else if(a==="int-card"){
    const R=I.round, ref=R.ids[R.i], id=ref.split(":")[0];
    if(v==="1"){ R.hits.push(ref); I.hits[id]=(I.hits[id]||0)+1; }
    if(!I.seen.includes(ref)) I.seen.push(ref);
    R.i++; save(); render();
  }
  else if(a==="int-round-end"){ I.round.ids=I.round.ids.slice(0,I.round.i); save(); render(); }
  else if(a==="int-mode"){ const R=I.round; if(v) I.modes[v]=(I.modes[v]||0)+1; R.reflect=(R.reflect||0)+1; save(); render(); }
  else if(a==="int-round-close"){ I.rounds=(I.rounds||0)+1; I.round=null; ui.intView="map"; save(); render(); window.scrollTo(0,0); }
  else if(a==="int-dream-add"){ const f=document.getElementById("intDream"); const d=f.value.trim(); if(d && !I.dreams.some(x=>x.toLowerCase()===d.toLowerCase())){ I.dreams.push(d); save(); } render(); }
  else if(a==="int-dream-del"){ I.dreams=I.dreams.filter(x=>x!==v); save(); render(); }
  else if(a==="int-exp"){ ui.intExp={ isle:v, t:null, e:null, alt:0, dream:null }; ui.intView="exp"; render(); window.scrollTo(0,0); }
  else if(a==="int-exp-dream"){ ui.intExp.dream=v; render(); }
  else if(a==="int-exp-set"){ ui.intExp[b.dataset.k]=+v; render(); }
  else if(a==="int-exp-alt"){ ui.intExp.alt=(ui.intExp.alt||0)+1; render(); }
  else if(a==="int-exp-reset"){ ui.intExp.t=null; ui.intExp.e=null; render(); }
  else if(a==="int-exp-take"){
    const x=ui.intExp, id=uid();
    addCheckin({ area:"interesse", text:x.text, inDays:2, link:"#/bereich/interesse" });
    I.pending.unshift({ id, isle:x.isle, dream:x.dream, text:x.text, size:x.size, ci:S.checkins[S.checkins.length-1].id, date:new Date().toISOString() });
    ui.intView="map"; ui.intSel=null; save(); toast("Vorgemerkt. Viel Freude bei der Expedition!"); render(); window.scrollTo(0,0);
  }
  else if(a==="int-drop"){ const p=I.pending.find(x=>x.id===v); if(p){ const c=S.checkins.find(c=>c.id===p.ci); if(c) c.done=true; } I.pending=I.pending.filter(x=>x.id!==v); save(); render(); }
  else if(a==="int-done"){ ui.intReflect=v; ui.intMore=null; ui.intView="reflect"; render(); window.scrollTo(0,0); }
  else if(a==="int-more"){ const t=document.getElementById("intTouch").value, w=document.getElementById("intTell").value; ui.intMore=v; render(); document.getElementById("intTouch").value=t; document.getElementById("intTell").value=w; }
  else if(a==="int-save"){
    const p=I.pending.find(x=>x.id===ui.intReflect); if(!p) return;
    if(!ui.intMore){ document.getElementById("intErr").textContent="Tippe noch an: Mehr davon?"; return; }
    const touch=document.getElementById("intTouch").value.trim(), tell=document.getElementById("intTell").value.trim();
    const moreTxt={ja:"Ja",vielleicht:"Vielleicht",nein:"Eher nicht"}[ui.intMore];
    const L=["Expedition: "+p.text]; if(touch) L.push("Berührt hat mich: "+touch); if(tell) L.push("Erzählen möchte ich es: "+tell); L.push("Mehr davon: "+moreTxt);
    addEntry({ area:"interesse", title:isleById(p.isle).name+(p.dream?" · "+p.dream:""), text:L.join("\n"), meta:{ isle:p.isle, dream:p.dream, more:ui.intMore } });
    I.exp[p.isle]=(I.exp[p.isle]||0)+1; I.bonus[p.isle]=(I.bonus[p.isle]||0)+({ja:2,vielleicht:1,nein:0}[ui.intMore]);
    const c=S.checkins.find(c=>c.id===p.ci); if(c) c.done=true;
    I.pending=I.pending.filter(x=>x.id!==p.id); ui.intView="map"; ui.intMore=null; save();
    toast("Im Journal festgehalten. Die Karte ist gewachsen."); render(); window.scrollTo(0,0);
  }
}

/* ---------- Router ---------- */
function render(){
  clearTimeout(breathTimer); breathTimer=null; clearInterval(losTick); losTick=null;
  const h = location.hash || "#/";
  let html;
  if(h==="#/journal") html=screenJournal();
  else if(h==="#/notiz") html=screenNotiz();
  else if(h==="#/pause") html=screenPause();
  else if(h==="#/mehr") html=screenMehr();
  else if(h==="#/bereich/loslassen") html=screenLos();
  else if(h==="#/bereich/erkennen") html=screenErk();
  else if(h==="#/bereich/interesse") html=screenInt();
  else if(h.startsWith("#/bereich/")) html=screenBereich(h.slice(10));
  else html=screenStart();
  app.innerHTML = html;
  if(h==="#/pause") startBreath();
  if(h==="#/bereich/loslassen") losAfterRender();
}
let lastRoute = "#/";
window.addEventListener("hashchange", ()=>{ ui.confirmDel=null; ui.confirmWipe=false; ui.losBackfill=false; ui.losConfirmDiscard=false; ui.erkConfirmCancel=false; ui.intView="map"; render(); window.scrollTo(0,0); });

function startBreath(){
  const b=document.getElementById("breath"), t=document.getElementById("breathTxt");
  let inhale=true;
  const step=()=>{ if(!b) return; b.classList.toggle("in",inhale); b.classList.toggle("out",!inhale); t.textContent=inhale?"Einatmen":"Ausatmen"; const d=inhale?4000:6000; inhale=!inhale; breathTimer=setTimeout(step,d); };
  requestAnimationFrame(step);
}

/* ---------- Sichern ---------- */
async function doExport(){
  const data = JSON.stringify({ app:"lebenskompass", exported:new Date().toISOString(), data:S }, null, 2);
  const d=new Date(), name=`lebenskompass-sicherung-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
  const file = new File([data], name, {type:"application/json"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Lebenskompass-Sicherung"});
    }else{
      const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    }
    S.lastBackup=new Date().toISOString(); save(); toast("Gesichert. Lege die Datei am besten in „Dateien“ ab."); render();
  }catch(e){ if(e && e.name!=="AbortError") toast("Sichern hat nicht geklappt."); }
}
document.getElementById("importFile").addEventListener("change", async ev=>{
  const f=ev.target.files[0]; ev.target.value=""; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); const d=j.data||j;
    if(!Array.isArray(d.entries)) throw 0;
    const have=new Set(S.entries.map(e=>e.id)); let n=0;
    d.entries.forEach(e=>{ if(e && e.id && e.date && !have.has(e.id)){ S.entries.push({id:String(e.id),date:String(e.date),area:String(e.area||"notiz"),title:String(e.title||""),text:String(e.text||""),meta:e.meta||null}); n++; } });
    if(Array.isArray(d.checkins)){ const hc=new Set(S.checkins.map(c=>c.id)); d.checkins.forEach(c=>{ if(c&&c.id&&!hc.has(c.id)) S.checkins.push(c); }); }
    save(); toast(n===1?"1 Eintrag wiederhergestellt.":`${n} Einträge wiederhergestellt.`); render();
  }catch(e){ toast("Diese Datei ist keine Lebenskompass-Sicherung."); }
});

/* ---------- Aktionen ---------- */
app.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==="go"){ location.hash=b.dataset.to; }
  else if(a==="back"){ if(history.length>1) history.back(); else location.hash="#/"; }
  else if(a==="sel"){ ui.sel = ui.sel===b.dataset.k ? null : b.dataset.k; render(); }
  else if(a==="filter"){ ui.filter=b.dataset.k; ui.confirmDel=null; render(); }
  else if(a==="del"){
    if(ui.confirmDel===id){ S.entries=S.entries.filter(x=>x.id!==id); ui.confirmDel=null; save(); toast("Eintrag gelöscht."); }
    else ui.confirmDel=id;
    render();
  }
  else if(a==="save-note"){
    const t=document.getElementById("nt").value, x=document.getElementById("nx").value;
    if(!x.trim()){ document.getElementById("nerr").textContent="Schreib zuerst ein paar Worte."; document.getElementById("nx").focus(); return; }
    addEntry({area:"notiz", title:t, text:x}); toast("Im Journal festgehalten."); location.hash="#/journal";
  }
  else if(a==="ci-done"||a==="ci-later"||a==="ci-drop"){
    const c=S.checkins.find(x=>x.id===id); if(!c) return;
    if(a==="ci-done" && c.link){ save(); location.hash=c.link; return; }
    if(a==="ci-done"){ c.done=true; addEntry({area:c.area, title:"Kleiner Schritt geschafft", text:c.text}); toast("Schön! Das steht jetzt im Journal."); }
    if(a==="ci-later"){ c.due=Date.now()+2*864e5; toast("Ich frage in zwei Tagen noch mal."); }
    if(a==="ci-drop"){ c.done=true; }
    save(); render();
  }
  else if(a.startsWith("los-")) losAction(a,b);
  else if(a.startsWith("erk-")) erkAction(a,b);
  else if(a.startsWith("int-")) intAction(a,b);
  else if(a==="export") doExport();
  else if(a==="snooze"){ S.backupSnooze=new Date().toISOString(); save(); render(); }
  else if(a==="import") document.getElementById("importFile").click();
  else if(a==="wipe"){ ui.confirmWipe=true; render(); }
  else if(a==="wipe-no"){ ui.confirmWipe=false; render(); }
  else if(a==="wipe-yes"){ S=fresh(); save(); ui.confirmWipe=false; toast("Alles gelöscht."); render(); }
});
app.addEventListener("input", e=>{
  if(e.target.id==="erkIn"){ const er=document.getElementById("erkErr"); if(er) er.textContent=""; }
  if(e.target.id==="losVal"){ const o=document.getElementById("losValOut"); if(o) o.textContent=fmtV(parseFloat(e.target.value)); }
  if(e.target.id==="losErrSrc"){ const er=document.getElementById("losErr"); if(er) er.textContent=""; }
  if(e.target.id==="nx"){ const er=document.getElementById("nerr"); if(er) er.textContent=""; } });

render();
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
